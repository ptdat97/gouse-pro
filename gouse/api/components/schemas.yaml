# Schema domain: sản phẩm, giỏ hàng, đơn hàng, tài chính, nội dung
# Tham chiếu: components/schemas.yaml#/ProductSummary

# ============================================================ SẢN PHẨM
# Chuỗi phân cấp: Brand → Collection → Product → Variant → SKU → Offer → Inventory
# Xem docs/02-domain/entities.md mục 1

BrandRef:
  type: object
  description: |
    Tham chiếu thương hiệu bên trong một tài nguyên khác.

    `name` KHÔNG bắt buộc, có chủ ý. Tên thương hiệu thuộc module
    `catalog`, và module `product` không gọi catalog ở tầng trình bày —
    làm vậy nghĩa là mỗi request sản phẩm kéo theo một request catalog.

    Trả `"name": ""` tệ hơn là bỏ trường: chuỗi rỗng trông như dữ liệu
    hợp lệ và sẽ hiển thị thành khoảng trắng trên trang, còn trường thiếu
    thì client biết là chưa có và đi lấy từ nguồn khác.

    Nguồn đúng cho tên, logo và mô tả là `GET /api/v1/brands/{brand_id}`.
  required: [id]
  properties:
    id:
      $ref: './common.yaml#/schemas/Id'
    name:
      type: string
    slug:
      type: string
    logo_url:
      type: string
      format: uri

CollectionRef:
  type: object
  description: |
    Bộ sưu tập — khái niệm **hạng nhất** trong thời trang, không phải nhãn phân loại.
    Có ngân sách sản xuất, mốc thời gian, và chỉ số sell-through riêng.

    `name` KHÔNG bắt buộc, cùng lý do với `BrandRef`.
  required: [id]
  properties:
    id:
      $ref: './common.yaml#/schemas/Id'
    name:
      type: string
      examples: ['Thu Đông 2026']
    season:
      type: string
      examples: ['FW2026']

SellerRef:
  type: object
  description: Thông tin seller hiển thị cho khách. Không chứa dữ liệu nội bộ.
  required: [id, name]
  properties:
    id:
      $ref: './common.yaml#/schemas/Id'
    name:
      type: string
    rating:
      type: number
      format: float
      minimum: 0
      maximum: 5
    response_time_hours:
      type: integer
    is_official:
      type: boolean
      description: True với own brand (seller nội bộ) hoặc đối tác chính hãng.

ProductSummary:
  type: object
  description: |
    Sản phẩm trong danh sách. Nhẹ hơn `ProductDetail`.

    **KHÔNG chứa giá.** Giá thuộc về OFFER, và module `product` nằm cùng
    tầng với `marketplace` nên không gọi được. Nhồi giá vào đây sẽ bắt MỌI
    lời gọi danh mục kéo theo truy vấn giá — kể cả trang quản trị, nơi
    không hiển thị giá bán.

    Trang tự ghép: gọi `listBuyBoxPrices` một lượt cho cả danh sách. Cùng
    mẫu với `lookupSellers`.

    Trước 26/08 schema này khai `price_from` là BẮT BUỘC trong khi API chưa
    bao giờ trả nó. Hậu quả nhìn thấy được: cửa hàng hiện dấu gạch thay cho
    giá, và TypeScript không báo gì vì nó tin đặc tả.
  required: [id, name, brand]
  properties:
    id:
      $ref: './common.yaml#/schemas/Id'
    name:
      type: string
    slug:
      type: string
    brand:
      $ref: '#/BrandRef'
    primary_image_url:
      type: string
      format: uri
    rating:
      type: object
      properties:
        average:
          type: number
          format: float
        count:
          type: integer
    available_colors:
      type: array
      description: Tên các màu có trong danh mục. Chuỗi, xem `Variant.color`.
      items:
        type: string
    available_sizes:
      type: array
      description: |
        **Chỉ liệt kê size CÒN HÀNG.** Hiển thị size đã hết trong danh sách
        là trải nghiệm tệ — khách chọn rồi mới biết không mua được.
      items:
        type: string
    offer_count:
      type: integer
      description: Số nhà bán — cho khách biết có nhiều lựa chọn.
    badges:
      type: array
      items:
        type: string
        enum: [FREE_SHIPPING, NEW_ARRIVAL, BEST_SELLER, LOW_STOCK, ON_SALE]

ProductDetail:
  type: object
  description: |
    Chi tiết sản phẩm. Ba trường đặc thù thời trang —
    `material_composition`, `size_chart`, `size_recommendation` —
    tác động **trực tiếp** tới tỷ lệ hoàn hàng.
  required: [id, name, brand, variants]
  properties:
    id:
      $ref: './common.yaml#/schemas/Id'
    name:
      type: string
    description:
      type: string
    brand:
      $ref: '#/BrandRef'
    collection:
      $ref: '#/CollectionRef'
    category_id:
      $ref: './common.yaml#/schemas/Id'
    product_type:
      type: string
      enum: [TOP, BOTTOM, DRESS, OUTERWEAR, SHOES, BAG, ACCESSORY]
    gender_target:
      type: string
      enum: [MEN, WOMEN, UNISEX, KIDS]
    material_composition:
      allOf:
        - $ref: './common.yaml#/schemas/MaterialComposition'
      description: Khách không biết chất liệu sẽ mua nhầm → hoàn hàng.
    care_instructions:
      type: string
      examples: ['Giặt máy ở 30°C, không dùng chất tẩy']
    origin_country:
      type: string
    images:
      type: array
      items:
        $ref: '#/Image'
    variants:
      type: array
      items:
        $ref: '#/Variant'
    size_chart:
      allOf:
        - $ref: './common.yaml#/schemas/SizeChart'
      description: Số đo thực tế giúp khách chọn đúng size.
    size_recommendation:
      type: [object, "null"]
      description: |
        Gợi ý size dựa trên lịch sử mua của khách. Chỉ có với khách đã
        đăng nhập và có dữ liệu. Cơ chế giảm trực tiếp tỷ lệ hoàn hàng.
      properties:
        suggested_size:
          type: string
        reason:
          type: string
          enum: [PREVIOUS_PURCHASE, BODY_MEASUREMENTS, RETURN_HISTORY]
    # KHÔNG có `buy_box_offer` và `other_offers_count` ở đây, có chủ ý.
    #
    # Buy box được quyết theo SKU, không theo sản phẩm. Một chiếc áo có SKU
    # size S, M, L; mỗi size là một cuộc cạnh tranh riêng giữa các nhà bán
    # và có thể có người thắng KHÁC nhau. Một trường "buy box của sản phẩm"
    # buộc máy chủ phải chọn bừa winner của một size nào đó rồi trình bày
    # nó như winner của cả sản phẩm — sai với khách xem size khác.
    #
    # Cùng lý do đó, `other_offers_count` ở mức sản phẩm không trả lời được
    # câu hỏi nào: đếm offer của size nào?
    #
    # Nguồn đúng là `GET /api/v1/products/{product_id}/offers` — trả offer
    # kèm `sku_id` và `is_buy_box`, nên trang lọc theo size khách đang chọn
    # rồi lấy winner của ĐÚNG size đó. Cửa hàng đã làm vậy sẵn.
    #
    # Cùng nhóm quyết định với `price_from` (xem 2.10 trong backlog): dữ
    # liệu của offer không nhồi vào danh mục, vì `product` cùng tầng với
    # `marketplace` nên không gọi được, và vì mọi lời gọi sản phẩm sẽ phải
    # kéo theo truy vấn offer kể cả nơi không hiển thị giá.

Variant:
  type: object
  description: Tổ hợp thuộc tính (màu + size). Ảnh thay đổi theo màu, không theo size.
  required: [id, color, skus]
  properties:
    id:
      $ref: './common.yaml#/schemas/Id'
    color:
      type: string
      description: |
        Tên màu, ví dụ "Trắng" hoặc "Xanh navy".

        **Là CHUỖI, không phải object `Color`.** Domain lưu thuộc tính biến
        thể trong một map `{color, size, ...}` — dùng map vì mỗi loại hàng
        có thuộc tính khác nhau (áo có độ dài tay, quần có kiểu ống).

        Nhóm màu để LỌC đã có: `color_family` suy ra từ tên màu và được
        đánh chỉ mục (migration 000038). Nó không trả ở đây vì khách lọc
        bằng tham số truy vấn chứ không đọc nhóm màu trên trang.

        Ô màu thật ở `color_hex` bên dưới — TÙY CHỌN, do người bán nhập.
      examples: ['Trắng']
    color_hex:
      type: string
      pattern: '^#[0-9A-Fa-f]{6}$'
      description: |
        Ô màu thật để khách chọn theo MÀU NHÌN THẤY, không theo tên —
        `common.yaml#/schemas/Color` nêu đúng lý do này từ đầu.

        TÙY CHỌN: khác `color_family` (suy được từ tên màu), mã màu phải
        do người bán NHẬP — "Xanh navy" ra được nhóm BLUE nhưng không ra
        được #1B2A49. Thiếu thì giao diện hiện ô chữ như cũ.

        Luôn CHỮ HOA: "#ff0000" và "#FF0000" là một màu, và để hai cách
        viết cùng tồn tại nghĩa là lọc theo mã màu bỏ sót một nửa.
      examples: ['#1B2A49']
    images:
      type: array
      items:
        $ref: '#/Image'
    skus:
      type: array
      items:
        $ref: '#/SKUSummary'

SKUSummary:
  type: object
  description: |
    Đơn vị lưu kho. **Định danh hàng hóa chung**, không thuộc seller nào —
    đây là cái cho phép biết "ba seller đang bán cùng một món hàng".
  required: [id, size]
  properties:
    id:
      $ref: './common.yaml#/schemas/Id'
    sku_code:
      type: string
      examples: ['SM-LIN-OXF-WHT-M']
    size:
      type: string
      description: |
        Kích cỡ, ví dụ "M" hoặc "38".

        **Chỉ là KÝ HIỆU.** Hệ quy chiếu làm ký hiệu này có nghĩa nằm ở
        `ProductDetail.size_chart.system` (ALPHA, EU, US...) cùng số đo
        thực tế — vì hệ size gắn với (thương hiệu, loại hàng), không gắn
        với từng SKU.

        **Là CHUỖI, không phải object `Size`.** Cùng lý do với
        `Variant.color`: domain giữ thuộc tính biến thể trong một map, nên
        chưa có chỗ cho HỆ SIZE (ALPHA/EU/US...).

        Đó là thiếu sót có hậu quả thật — "M" của thương hiệu này khác "M"
        của thương hiệu kia, và "38" giày khác "38" quần — nhưng sửa nó
        cần thêm trường ở domain. Xem P3-22.
      examples: ['M']
    # KHÔNG có `available` ở đây, có chủ ý.
    #
    # "Size này mua được không" là câu hỏi về LỜI CHÀO BÁN, không phải về
    # số hàng trong kho: SKU còn 100 cái mà không nhà bán nào đang chào
    # bán thì khách vẫn không mua được. Câu trả lời nằm ở `is_sellable`
    # của offer — máy chủ đã tổng hợp sẵn tồn kho + trạng thái nhà bán +
    # trạng thái offer vào đó.
    #
    # Thêm một trường thứ hai trả lời cùng câu hỏi là cài quy tắc ở hai
    # nơi, và hai nơi sẽ lệch. Size hết hàng VẪN được trả về ở đây (để
    # hiển thị gạch chéo), chỉ là "hết hàng" do offer quyết định.

Image:
  type: object
  required: [url]
  properties:
    url:
      type: string
      format: uri
    alt:
      type: string
      description: Bắt buộc cho khả năng tiếp cận và SEO.
    order:
      type: integer

Offer:
  type: object
  description: |
    Lời chào bán của **một seller** cho một SKU — đơn vị khách thực sự mua.

    Offer **không chứa số lượng tồn kho**: nguồn sự thật là `InventoryItem`.
    Câu hỏi giao diện cần trả lời không phải "còn mấy cái" mà là **mua được
    hay không**, và câu đó là `is_sellable`.

    Endpoint này **không** trả tên nhà bán, chỉ trả `seller_id`. Ghép dữ
    liệu là việc của TRANG, không phải của ENDPOINT: trang so sánh nhà bán
    tra tên theo lô cho cả danh sách, thay vì mỗi offer kéo theo một bản
    sao hồ sơ nhà bán mà phần lớn lời gọi không dùng tới.
  required:
    [id, sku_id, seller_id, price, condition, handling_time_hours,
     is_buy_box, is_sellable, status]
  properties:
    id:
      $ref: './common.yaml#/schemas/Id'
    sku_id:
      $ref: './common.yaml#/schemas/Id'
    seller_id:
      $ref: './common.yaml#/schemas/Id'
    price:
      $ref: './common.yaml#/schemas/Money'
    compare_at_price:
      $ref: './common.yaml#/schemas/Money'
    condition:
      type: string
      enum: [NEW, USED_LIKE_NEW, USED_GOOD]
    handling_time_hours:
      type: integer
      description: Thời gian nhà bán cần để chuẩn bị hàng.
    is_buy_box:
      type: boolean
      description: Offer được chọn sẵn khi khách mở trang.
    is_sellable:
      type: boolean
      description: |
        Khách mua được offer này hay không — **cờ mà giao diện phải dùng**
        để bật/tắt nút thêm giỏ.

        KHÁC với việc offer có hiện ra hay không: offer hết hàng vẫn hiện
        (để khách đăng ký nhận thông báo) nhưng `is_sellable: false`.

        Đừng suy lại từ `status` ở giao diện: quy tắc còn phụ thuộc tồn kho
        và trạng thái nhà bán, và suy ở hai nơi thì hai nơi sẽ lệch.
    status:
      type: string
      description: |
        **KHÔNG có `OUT_OF_STOCK`.** Hết hàng là sự thật của tồn kho, không
        phải một trạng thái của lời chào bán: offer hết hàng vẫn `ACTIVE`
        và vẫn hiển thị (để khách biết có tổ hợp màu/size đó), chỉ là
        `is_sellable` tắt.

        Lưu nó thành trạng thái riêng là để một sự thật ở hai nơi, và hai
        nơi thì sớm muộn lệch nhau — xem P3-23 trong backlog.
      enum: [DRAFT, ACTIVE, SUSPENDED, ARCHIVED]

SellerOffer:
  type: object
  description: |
    Offer nhìn từ phía **người bán** — khác `Offer` của trang công khai.

    Hai góc nhìn KHÔNG dùng chung schema được, vì mỗi bên cần đúng cái bên
    kia cố tình giấu:

    - Người bán cần `status`: họ phải biết hàng của mình đang bán, đang tạm
      ngừng hay đã bị đình chỉ. Khách thì không — trang công khai đơn giản
      là không hiện offer không bán được.
    - Khách cần `is_buy_box` và `seller`: kết quả cạnh tranh giữa các seller.
      Với người bán, `is_buy_box` là thuộc tính của cuộc so sánh chứ không
      phải của offer, còn `seller` luôn là chính họ.
  required: [id, sku_id, seller_id, price, condition, status, is_sellable, created_at]
  properties:
    id:
      $ref: './common.yaml#/schemas/Id'
    sku_id:
      $ref: './common.yaml#/schemas/Id'
    seller_id:
      $ref: './common.yaml#/schemas/Id'
    price:
      $ref: './common.yaml#/schemas/Money'
    compare_at_price:
      $ref: './common.yaml#/schemas/Money'
    condition:
      type: string
      enum: [NEW, USED_LIKE_NEW, USED_GOOD]
    handling_time_hours:
      type: integer
    min_order_quantity:
      type: integer
    max_order_quantity:
      type: integer
      description: Vắng mặt nghĩa là không giới hạn.
    status:
      type: string
      enum: [DRAFT, ACTIVE, SUSPENDED, ARCHIVED]
    is_sellable:
      type: boolean
      description: |
        Khách mua được hay không — **cùng một câu hỏi và cùng một câu trả
        lời với `Offer.is_sellable` của trang công khai**. Người bán hỏi
        "hàng của tôi bán được không" thì phải nhận đúng câu khách nhận
        được, không phải một phiên bản dễ dãi hơn.

        **Đừng suy ra từ `status` ở giao diện**: quy tắc còn phụ thuộc tồn
        kho VÀ việc seller có bị đình chỉ không, và suy ở hai nơi thì hai
        nơi sẽ lệch. Chính máy chủ đã từng vi phạm đúng câu này — trường
        được tính bằng `status == ACTIVE`, nên Seller Center không bao giờ
        có tín hiệu hết hàng.

        **`status: ACTIVE` kèm `is_sellable: false` là tín hiệu HẾT HÀNG**
        (hoặc tài khoản nhà bán đang bị đình chỉ). Đó là cặp giá trị giao
        diện nhà bán phải đọc: hết hàng KHÔNG phải một trạng thái của offer
        (xem `Offer.status`), nên `status` một mình không nói lên điều đó.
    created_at:
      $ref: './common.yaml#/schemas/Timestamp'

# ============================================================ GIỎ HÀNG
Cart:
  type: object
  description: |
    Giỏ hàng **không giữ tồn kho** — chỉ checkout mới giữ.

    Hệ quả: hiển thị "còn hàng" ở giỏ là **thông tin tham khảo**, không phải
    cam kết. Khách có thể thấy còn hàng ở giỏ nhưng hết ở checkout.
  required: [id, groups, subtotal, total]
  properties:
    id:
      $ref: './common.yaml#/schemas/Id'
    groups:
      type: array
      description: |
        Nhóm theo seller để khách hiểu hàng đến từ đâu và **thời gian giao
        khác nhau** — tránh thắc mắc "sao chỉ nhận được một phần".
      items:
        $ref: '#/CartGroup'
    subtotal:
      $ref: './common.yaml#/schemas/Money'
    estimated_shipping:
      $ref: './common.yaml#/schemas/Money'
    discount_amount:
      $ref: './common.yaml#/schemas/Money'
    total:
      allOf:
        - $ref: './common.yaml#/schemas/Money'
      description: |
        **Do backend tính.** Frontend chỉ hiển thị — không tự cộng,
        kể cả phép cộng đơn giản.
    expires_at:
      $ref: './common.yaml#/schemas/Timestamp'

CartGroup:
  type: object
  required: [seller, items]
  properties:
    seller:
      $ref: '#/SellerRef'
    items:
      type: array
      items:
        $ref: '#/CartItem'
    estimated_delivery_days:
      type: integer
    subtotal:
      $ref: './common.yaml#/schemas/Money'

CartItem:
  type: object
  required: [id, offer_id, product_name, unit_price, quantity, line_total]
  properties:
    id:
      $ref: './common.yaml#/schemas/Id'
    offer_id:
      allOf:
        - $ref: './common.yaml#/schemas/Id'
      description: Trỏ tới **Offer**, không phải SKU — khách mua của một nhà bán cụ thể.
    product_id:
      $ref: './common.yaml#/schemas/Id'
    product_name:
      type: string
    variant_description:
      type: string
      examples: ['Trắng / M']
    image_url:
      type: string
      format: uri
    unit_price:
      $ref: './common.yaml#/schemas/Money'
    quantity:
      $ref: './common.yaml#/schemas/Quantity'
    line_total:
      $ref: './common.yaml#/schemas/Money'
    availability:
      type: string
      enum: [IN_STOCK, LOW_STOCK, OUT_OF_STOCK, UNAVAILABLE]
      description: |
        Món không còn hợp lệ được **đánh dấu**, không tự động xóa —
        xóa im lặng làm khách bối rối.

AttributionSource:
  type: object
  description: |
    Nguồn giới thiệu, ghi nhận **ngay khi thêm giỏ** (không chờ tới lúc mua).

    Cho phép đo tỷ lệ "thêm giỏ" của từng nội dung và quy kết chính xác hơn
    khi khách mua sau vài ngày.
  properties:
    content_id:
      $ref: './common.yaml#/schemas/Id'
    creator_id:
      $ref: './common.yaml#/schemas/Id'

# ============================================================ CHECKOUT
Checkout:
  type: object
  description: |
    Phiên thanh toán. Khác giỏ hàng ở hai điểm quyết định:
    **có giữ tồn kho** (TTL 15 phút) và **giá được đóng băng**.
  required: [id, status, expires_at, lines, total]
  properties:
    id:
      $ref: './common.yaml#/schemas/Id'
    status:
      type: string
      enum: [STARTED, PENDING_PAYMENT, COMPLETED, EXPIRED, CANCELLED]
    expires_at:
      allOf:
        - $ref: './common.yaml#/schemas/Timestamp'
      description: |
        Thời hạn giữ hàng. Hết hạn → tồn kho tự giải phóng, khách phải
        bắt đầu checkout mới.
    lines:
      type: array
      items:
        $ref: '#/CheckoutLine'
    shipping_address:
      $ref: './common.yaml#/schemas/Address'
    shipping_method:
      type: string
      enum: [STANDARD, EXPRESS]
      description: |
        Cách giao khách ĐÃ CHỌN. Vắng mặt nghĩa là chưa chọn.

        Giao diện cần trường này để biết bước "chọn cách giao" đã xong hay
        chưa. Thiếu nó, cách suy duy nhất còn lại là `shipping_fee > 0` —
        và cách ấy SAI ở đúng chỗ đắt nhất: đơn đạt ngưỡng miễn phí ship
        có phí bằng 0, nên giao diện đọc thành "chưa chọn" rồi khóa nút
        đặt hàng. Khách mua càng nhiều càng không đặt được. Xem P3-73.

        Một con số TIỀN không bao giờ là một lá cờ boolean: 0 là giá trị
        hợp lệ của tiền, không phải "không có".
    shipping_groups:
      type: array
      description: Thời gian giao hiển thị **riêng cho từng nhóm**, không gộp một con số.
      items:
        type: object
        properties:
          seller:
            $ref: '#/SellerRef'
          estimated_delivery_date:
            type: string
            format: date
          shipping_fee:
            $ref: './common.yaml#/schemas/Money'
    subtotal:
      $ref: './common.yaml#/schemas/Money'
    shipping_fee:
      $ref: './common.yaml#/schemas/Money'
    discount_amount:
      $ref: './common.yaml#/schemas/Money'
    tax_amount:
      $ref: './common.yaml#/schemas/Money'
    total:
      $ref: './common.yaml#/schemas/Money'

CheckoutLine:
  type: object
  required: [offer_id, product_name, unit_price, quantity]
  properties:
    offer_id:
      $ref: './common.yaml#/schemas/Id'
    product_name:
      type: string
    variant_description:
      type: string
    unit_price:
      allOf:
        - $ref: './common.yaml#/schemas/Money'
      description: |
        **Đã đóng băng** tại thời điểm bắt đầu checkout. Seller đổi giá
        giữa chừng không ảnh hưởng phiên này.
    quantity:
      $ref: './common.yaml#/schemas/Quantity'
    line_total:
      $ref: './common.yaml#/schemas/Money'

# ============================================================ ĐƠN HÀNG
PaymentMethod:
  type: string
  enum: [CARD, BANK_TRANSFER, E_WALLET, COD]
  description: |
    Cách khách trả tiền, **đóng băng** tại thời điểm đặt — cùng nhóm với
    giá và địa chỉ giao. Đổi phương thức của một đơn đã đặt là một nghiệp
    vụ khác, không phải sửa một trường.

    **KHÔNG suy được từ `status`.** Đơn COD và đơn chờ chuyển khoản đều ở
    `PENDING_PAYMENT`; chỉ một trong hai thu tiền ở cửa nhà khách. Đó là
    câu hỏi kho và đơn vị vận chuyển thực sự cần trả lời.

    **VẮNG MẶT nghĩa là chưa chọn**, không phải dữ liệu lỗi: đường
    `placeOrder` không nhận trường này (thân request của nó chỉ có
    `checkout_id`), và đơn đặt trước 06/09/2026 không lưu lựa chọn nào —
    trước đó máy chủ kiểm tra `payment_method` rồi bỏ qua.

OrderSummary:
  type: object
  required: [id, order_number, status, total, placed_at]
  properties:
    id:
      $ref: './common.yaml#/schemas/Id'
    order_number:
      type: string
      description: Mã khách nhìn thấy, dễ đọc qua điện thoại.
      examples: ['FC-2026-08-001234']
    status:
      $ref: '#/OrderStatus'
    total:
      $ref: './common.yaml#/schemas/Money'
    item_count:
      type: integer
    payment_method:
      $ref: '#/PaymentMethod'
    placed_at:
      $ref: './common.yaml#/schemas/Timestamp'

OrderDetail:
  type: object
  description: |
    Đơn hàng — **hợp đồng với khách hàng**.

    Khách thấy **một đơn** nhưng có thể có **nhiều lô giao**, vì hàng đến từ
    nhiều nguồn không thể đóng chung gói.

    **`shipments` KHÔNG do endpoint này trả về.** Dữ liệu lô giao thuộc
    module `fulfillment`, và module `order` không được gọi nó — fulfillment
    đã phụ thuộc order, gọi ngược tạo phụ thuộc vòng (ADR-0007).

    Việc ghép hai nguồn là của **trang**, không phải của **endpoint**. Trang
    chi tiết đơn gọi endpoint này để lấy dòng hàng và tiền, rồi gọi endpoint
    lô giao để lấy tiến độ giao. Endpoint lô giao cho khách **chưa tồn tại**
    — xem backlog P1.8.
  required: [id, order_number, status, total, placed_at]
  properties:
    id:
      $ref: './common.yaml#/schemas/Id'
    order_number:
      type: string
    status:
      $ref: '#/OrderStatus'
    placed_at:
      $ref: './common.yaml#/schemas/Timestamp'
    completed_at:
      $ref: './common.yaml#/schemas/Timestamp'
    shipping_address:
      allOf:
        - $ref: './common.yaml#/schemas/Address'
      description: Đã **sao chép** vào đơn — khách sửa sổ địa chỉ không làm đổi đơn cũ.
    lines:
      type: array
      description: |
        Dòng hàng của đơn với con số **đã đóng băng** tại thời điểm đặt.
      items:
        $ref: '#/OrderDetailLine'
    shipments:
      type: array
      description: |
        Lô giao. **KHÔNG do endpoint này trả về** — gọi
        `GET /api/v1/orders/{order_id}/shipments` (module `fulfillment`).
        Giữ lại trong lược đồ vì trang chi tiết đơn ghép hai nguồn: dòng
        hàng và tiền từ đây, tiến độ giao từ endpoint kia.
      items:
        $ref: '#/Shipment'
    subtotal:
      $ref: './common.yaml#/schemas/Money'
    shipping_fee:
      $ref: './common.yaml#/schemas/Money'
    discount_amount:
      $ref: './common.yaml#/schemas/Money'
    total:
      $ref: './common.yaml#/schemas/Money'
    can_cancel:
      type: boolean
      description: |
        Theo **trạng thái tổng hợp** của đơn. Điều kiện đầy đủ còn cần
        "chưa có lô nào `PACKED`", thứ chỉ module fulfillment biết — nên
        `true` ở đây vẫn có thể bị từ chối `409` khi gọi hủy.
    cancellation_reason:
      type: string
      description: Chỉ có ở đơn **khách tự hủy**. Đơn do quản trị viên hủy có lý do ở nhật ký thao tác.
    can_return:
      type: boolean
      description: |
        Khách còn trả hàng được không. Tính từ mốc giao + hạn đổi trả
        (`returns.window_hours`), KHÔNG lưu sẵn — đổi tham số phải áp
        ngay, và lưu sẵn nghĩa là màn hình nói một đằng còn hệ thống xử
        một nẻo.

        Luôn `false` với đơn chưa giao xong: khi đó câu hỏi đúng là "bao
        giờ tới", không phải "còn trả được không".
    payment_method:
      $ref: '#/PaymentMethod'

OrderDetailLine:
  type: object
  required: [order_line_id, product_name, quantity, unit_price, line_total, status]
  properties:
    order_line_id:
      $ref: './common.yaml#/schemas/Id'
    product_name:
      type: string
    variant_description:
      type: string
    quantity:
      $ref: './common.yaml#/schemas/Quantity'
    unit_price:
      allOf:
        - $ref: './common.yaml#/schemas/Money'
      description: '**Đã đóng băng** tại thời điểm đặt hàng.'
    line_total:
      $ref: './common.yaml#/schemas/Money'
    status:
      type: string
      enum: [ACTIVE, CANCELLED, RETURNED]

OrderStatus:
  type: string
  description: |
    Trạng thái tổng hợp, **suy ra** từ trạng thái các `FulfillmentOrder` —
    không tự đặt.

    `DELIVERED` khác `COMPLETED`: giao hàng xong chưa phải kết thúc, còn
    thời hạn đổi trả. Payout cho seller chỉ diễn ra sau `COMPLETED`.
  enum:
    - PENDING_PAYMENT
    - PAID
    - PROCESSING
    - PARTIALLY_SHIPPED
    - SHIPPED
    - PARTIALLY_DELIVERED
    - DELIVERED
    - COMPLETED
    - PARTIALLY_CANCELLED
    - CANCELLED

Shipment:
  type: object
  description: Góc nhìn khách hàng của một `FulfillmentOrder`.
  required: [fulfillment_number, seller, status, items]
  properties:
    fulfillment_number:
      type: string
      examples: ['FC-2026-08-001234-A']
    seller:
      $ref: '#/SellerRef'
    status:
      $ref: '#/FulfillmentStatus'
    tracking_number:
      type: [string, "null"]
    shipping_provider:
      type: [string, "null"]
    estimated_delivery_date:
      type: string
      format: date
    delivered_at:
      $ref: './common.yaml#/schemas/Timestamp'
    return_deadline:
      allOf:
        - $ref: './common.yaml#/schemas/Timestamp'
      description: |
        Hạn đổi trả. Quan trọng với thời trang — khách cần biết còn bao lâu.
    items:
      type: array
      items:
        $ref: '#/OrderLineSummary'

FulfillmentStatus:
  type: string
  description: |
    Trạng thái của MỘT GÓI GIAO, khác `OrderStatus` là trạng thái tổng hợp
    của cả đơn. Một đơn có thể có gói `DELIVERED` và gói `PACKED` cùng lúc.
  enum:
    - PENDING
    - ALLOCATED
    - CONFIRMED
    - PICKING
    - PACKED
    - HANDED_OVER
    - IN_TRANSIT
    - DELIVERED
    - DELIVERY_FAILED
    - COMPLETED
    - CANCELLED

OrderLineSummary:
  type: object
  required: [order_line_id, product_name, quantity, unit_price]
  properties:
    order_line_id:
      $ref: './common.yaml#/schemas/Id'
    product_id:
      $ref: './common.yaml#/schemas/Id'
    sku_id:
      $ref: './common.yaml#/schemas/Id'
    product_name:
      allOf:
        - type: string
      description: |
        **Đóng băng** tại thời điểm mua. Seller đổi tên sản phẩm không làm
        hóa đơn cũ hiển thị sai.
    variant_description:
      type: string
    image_url:
      type: string
      format: uri
    quantity:
      $ref: './common.yaml#/schemas/Quantity'
    unit_price:
      allOf:
        - $ref: './common.yaml#/schemas/Money'
      description: Đóng băng — giá đổi không ảnh hưởng đơn cũ.
    line_total:
      $ref: './common.yaml#/schemas/Money'
    status:
      type: string
      enum: [ACTIVE, CANCELLED, RETURNED]

# ============================================================ TRẢ HÀNG
ReturnReasonCode:
  type: string
  description: |
    Lý do hoàn hàng **chuẩn hóa** — không phải văn bản tự do.

    Lý do **quyết định dòng tiền** (bên nào chịu chi phí) và **hành động
    khắc phục** (sửa bảng size, sửa mô tả, truy vết lô sản xuất).
    Văn bản tự do không phân tích được.
  enum:
    - SIZE_TOO_SMALL
    - SIZE_TOO_LARGE
    - NOT_AS_DESCRIBED
    - COLOR_DIFFERENT
    - QUALITY_ISSUE
    - DEFECTIVE
    - WRONG_ITEM_SENT
    - DAMAGED_IN_TRANSIT
    - CHANGED_MIND
    - LATE_DELIVERY

ReturnRequest:
  type: object
  description: |
    Một yêu cầu trả hàng. Thuộc về ĐÚNG MỘT nhà bán — người duyệt là nhà
    bán, nên một yêu cầu trải trên hai gian hàng thì không ai duyệt được.

    **Sửa 17/09/2026 cho khớp mã đang chạy.** Bản trước khai `lines` (mã
    trả `items`), khai `lines[].refund_amount` (mã trả `refund`), khai bốn
    trạng thái KHÔNG tồn tại trong domain (`IN_TRANSIT`, `INSPECTING`,
    `INSPECTED`, `COMPLETED`) và THIẾU trạng thái `CANCELLED` có thật.

    Lệch cuối cùng là lệch nguy hiểm nhất: client phân nhánh theo `status`
    sẽ không có nhánh nào cho yêu cầu khách đã tự hủy.
  required: [id, order_id, status, reason_code, refund_amount, items, requested_at]
  properties:
    id:
      $ref: './common.yaml#/schemas/Id'
    order_id:
      $ref: './common.yaml#/schemas/Id'
    status:
      type: string
      description: |
        Vòng đời thật của domain:

            REQUESTED  → APPROVED → RECEIVED → REFUNDED
                       → REJECTED
                       → CANCELLED   (khách tự rút khi chưa ai xử lý)

        Kiểm định hàng về là một bước RIÊNG, ghi vào từng dòng
        (`items[].inspection`) chứ không đổi trạng thái của yêu cầu: một
        yêu cầu trả hai món có thể một món bán lại được và một món hỏng.
      enum: [REQUESTED, APPROVED, REJECTED, RECEIVED, REFUNDED, CANCELLED]
    reason_code:
      allOf:
        - $ref: '#/ReturnReasonCode'
      description: |
        Lý do ở mức YÊU CẦU. Mã chuẩn hóa chứ không phải văn bản tự do —
        đây là thứ nuôi gợi ý size và tín hiệu nhu cầu: `SIZE_TOO_SMALL`
        đếm được, "áo hơi chật" thì không.
    customer_note:
      type: string
      description: Khách mô tả thêm bằng lời của họ.
    reject_reason:
      type: string
      description: Có khi `status = REJECTED`. Khách đọc được câu này.
    refund_amount:
      allOf:
        - $ref: './common.yaml#/schemas/Money'
      description: |
        Tính theo **giá thực trả** (sau khi phân bổ giảm giá), không phải
        giá niêm yết.
    items:
      type: array
      items:
        $ref: '#/ReturnLine'
    requested_at:
      $ref: './common.yaml#/schemas/Timestamp'

ReturnLine:
  type: object
  required: [order_line_id, sku_id, quantity, reason_code, refund]
  properties:
    order_line_id:
      $ref: './common.yaml#/schemas/Id'
    sku_id:
      $ref: './common.yaml#/schemas/Id'
    quantity:
      $ref: './common.yaml#/schemas/Quantity'
    reason_code:
      $ref: '#/ReturnReasonCode'
    reason_detail:
      type: string
    refund:
      $ref: './common.yaml#/schemas/Money'
    inspection:
      type: string
      description: |
        Rỗng nghĩa là CHƯA kiểm định, không phải "đạt". Hàng chưa kiểm nằm
        ở trạng thái `Returned` và không bán lại được.
      enum: ['', PASSED, FAILED]
    inspection_note:
      type: string
      description: Bắt buộc khi `inspection = FAILED`.

# ============================================================ NỘI DUNG
ContentSummary:
  type: object
  required: [id, content_type, title]
  properties:
    id:
      $ref: './common.yaml#/schemas/Id'
    content_type:
      type: string
      enum: [VIDEO, IMAGE, LOOKBOOK, ARTICLE, OUTFIT, LIVE]
    title:
      type: string
    creator:
      $ref: '#/CreatorRef'
    is_sponsored:
      type: boolean
      description: |
        Hệ thống **tự động** đặt khi nội dung thuộc chiến dịch có trả phí.
        Creator không tự khai và không tắt được — nghĩa vụ pháp lý của nền tảng.
    media:
      type: array
      items:
        $ref: '#/Image'
    published_at:
      $ref: './common.yaml#/schemas/Timestamp'
    engagement:
      type: object
      properties:
        views:
          type: integer
        likes:
          type: integer
        saves:
          type: integer

CreatorRef:
  type: object
  required: [id, display_name]
  properties:
    id:
      $ref: './common.yaml#/schemas/Id'
    display_name:
      type: string
    avatar_url:
      type: string
      format: uri
    creator_type:
      type: string
      enum: [KOC, KOL, INFLUENCER, STYLIST, CONTENT_PARTNER]

Outfit:
  type: object
  description: |
    Bộ phối đồ — đơn vị nội dung **đặc thù thời trang**.

    Không phải "bài viết có nhiều link": có tổng giá, cho phép mua cả bộ,
    và có sản phẩm thay thế khi hết hàng.
  required: [id, name, items]
  properties:
    id:
      $ref: './common.yaml#/schemas/Id'
    name:
      type: string
      examples: ['Đi làm mùa thu']
    description:
      type: string
    creator:
      $ref: '#/CreatorRef'
    is_sponsored:
      type: boolean
    media:
      type: array
      items:
        $ref: '#/Image'
    items:
      type: array
      minItems: 2
      items:
        $ref: '#/OutfitItem'
    total_price:
      allOf:
        - $ref: './common.yaml#/schemas/Money'
      description: Tổng giá cả bộ — cho phép "mua cả bộ", tăng giá trị đơn hàng.
    style_tags:
      type: array
      items:
        type: string

OutfitItem:
  type: object
  required: [product_id, name, price, available]
  properties:
    product_id:
      $ref: './common.yaml#/schemas/Id'
    variant_id:
      $ref: './common.yaml#/schemas/Id'
    name:
      type: string
    image_url:
      type: string
      format: uri
    price:
      $ref: './common.yaml#/schemas/Money'
    role:
      type: string
      enum: [MAIN, COMPLEMENT, ACCESSORY]
    available:
      type: boolean
    substitutes:
      type: array
      description: |
        Sản phẩm thay thế khi hết hàng. **Nội dung sống lâu hơn sản phẩm** —
        video hay được xem nhiều tháng khi sản phẩm gốc đã hết. Không được
        để nội dung dẫn tới trang lỗi.
      items:
        $ref: '#/ProductSummary'

ProductTag:
  type: object
  description: Gắn sản phẩm vào nội dung, có vị trí không gian hoặc thời gian.
  required: [product_id]
  properties:
    product_id:
      $ref: './common.yaml#/schemas/Id'
    offer_id:
      $ref: './common.yaml#/schemas/Id'
    position_x:
      type: number
      format: float
      minimum: 0
      maximum: 1
      description: Vị trí tương đối trên ảnh (0–1).
    position_y:
      type: number
      format: float
      minimum: 0
      maximum: 1
    timestamp_second:
      type: integer
      description: Vị trí trong video (giây).

Review:
  type: object
  required: [id, rating, created_at]
  properties:
    id:
      $ref: './common.yaml#/schemas/Id'
    rating:
      type: integer
      minimum: 1
      maximum: 5
    title:
      type: string
    body:
      type: string
    images:
      type: array
      items:
        $ref: '#/Image'
    purchased_size:
      type: string
      description: Size khách đã mua — thông tin hữu ích cho người mua sau.
    fit_feedback:
      type: string
      enum: [TOO_SMALL, TRUE_TO_SIZE, TOO_LARGE]
      description: Phản hồi về form dáng — đầu vào cải thiện bảng size.
    is_verified_purchase:
      type: boolean
      description: Chỉ khách **đã mua và nhận hàng** mới được đánh giá.
    created_at:
      $ref: './common.yaml#/schemas/Timestamp'

# ============================================================ TÀI CHÍNH
SellerBalance:
  type: object
  description: |
    Số dư seller ở **năm trạng thái**. Hiển thị đủ giúp seller hiểu vì sao
    chưa nhận được tiền — giảm khiếu nại đáng kể.

    Nguồn sự thật duy nhất là module `payment`. Không module nào khác
    được tự cộng trừ bản ghi để tính.
  required: [currency, pending, available]
  properties:
    currency:
      type: string
    pending:
      allOf:
        - $ref: './common.yaml#/schemas/Money'
      description: Đơn đã giao, **đang trong thời hạn đổi trả** — chưa được rút.
    available:
      allOf:
        - $ref: './common.yaml#/schemas/Money'
      description: Đã hết hạn đổi trả, sẵn sàng chi trả.
    processing:
      $ref: './common.yaml#/schemas/Money'
    on_hold:
      allOf:
        - $ref: './common.yaml#/schemas/Money'
      description: Bị giữ do tranh chấp, vi phạm, hoặc yêu cầu pháp lý.
    reserve_held:
      allOf:
        - $ref: './common.yaml#/schemas/Money'
      description: |
        Giữ bảo đảm theo chính sách — cơ chế bảo vệ khi seller có tỷ lệ
        hoàn hàng cao hoặc bỏ trốn với số dư âm.
    # `next_settlement_date` đã BỎ (17/09/2026).
    #
    # Trường này mô tả một lịch chi trả cố định. Không có lịch nào: job
    # `taoDoiSoat` chạy MỖI GIỜ và gom mọi khoản đã rút được, nên câu trả
    # lời đúng luôn là "trong vòng một giờ nữa" — một thông tin không đáng
    # một trường.
    #
    # Không đường nào từng điền nó, tức nó thuộc đúng dạng lỗi ở backlog
    # mục 8. Và như `buy_box_offer`, câu hỏi đầu tiên không phải "ai điền"
    # mà "giá trị đúng của nó là gì" — ở đây là: không có.

Settlement:
  type: object
  description: |
    Một đợt đối soát: gom các khoản đã rút được của một gian hàng thành một
    lần chi trả.

    # Bản trước của schema này mô tả một thứ KHÔNG tồn tại

    Nó khai `period: {from, to}` và một `summary` tám dòng — hoa hồng nền
    tảng, phí thanh toán, phí vận hành, hoa hồng creator, hoàn hàng, điều
    chỉnh. Mã trả về một hình dạng khác hẳn: `period_start`/`period_end`
    phẳng và BA con số. Một giao diện viết theo schema cũ sẽ hiện trống
    toàn bộ. Sửa 17/09/2026 theo đúng cách đã làm với `ReturnRequest`
    (P3-57): đặc tả nói thứ mã TRẢ, không nói thứ ai đó từng định làm.

    # Vì sao BA con số, không phải tám

    Ba con số dưới đây trả lời đúng một câu hỏi: **tôi được chuyển bao
    nhiêu, và vì sao không phải nhiều hơn.**

    Tám dòng kia trả lời câu hỏi rộng hơn — *cấu thành* của số tiền — và
    chúng CHƯA tính được: đợt đối soát gom theo khoản rút được ở
    `seller_balance_entry`, không gom theo loại bút toán. Tách ra được, mà
    đó là một tính năng chứ không phải một phép đổi tên. Xem P3-60.
  required: [id, status, currency, period_start, period_end, gross_amount, deficit_amount, net_amount, created_at]
  properties:
    id:
      $ref: './common.yaml#/schemas/Id'
    status:
      type: string
      description: |
        BA trạng thái, không phải bốn. `PENDING_CONFIRMATION` của bản trước
        chưa bao giờ tồn tại trong `domain.TrangThaiDoiSoat`.
      enum: [DRAFT, CONFIRMED, PAID]
    currency:
      type: string
    period_start:
      type: string
      format: date-time
      description: |
        `date-time`, không phải `date`: mã trả RFC3339. Cắt về ngày ở phía
        hiển thị, đừng cắt ở hợp đồng.
    period_end:
      type: string
      format: date-time
    gross_amount:
      allOf:
        - $ref: './common.yaml#/schemas/Money'
      description: Tổng khoản đã rút được, gom trong đợt.
    deficit_amount:
      allOf:
        - $ref: './common.yaml#/schemas/Money'
      description: |
        Phần nhà bán đang NỢ, THU ĐƯỢC ở đợt này — thường do hoàn hàng vượt
        doanh thu kỳ trước.

        Hiện ra ngoài chứ KHÔNG giấu: nhà bán thấy số thực chi nhỏ hơn tổng
        và cần biết vì sao, nếu không mọi đợt như thế đều thành khiếu nại.

        Nhỏ hơn hoặc bằng `gross_amount`: đợt chỉ thu được tới mức tổng của
        nó. Nợ còn lại nằm tiếp ở số dư đang chờ (âm) và kỳ sau thu tiếp.

        Mỗi đồng ở đây có một BÚT TOÁN thật (`ADJUSTMENT`, tham chiếu
        `SETTLEMENT`) ghi cùng giao dịch tạo đợt. Tới 23/09/2026 phép trừ
        này chỉ nằm trên giấy, nên số âm còn nguyên và đợt kế tiếp trừ LẠI
        cùng khoản ấy — mỗi giờ một lần. Xem P3-71.
    net_amount:
      allOf:
        - $ref: './common.yaml#/schemas/Money'
      description: |
        Số ĐEM ĐI CHI TRẢ. Không bao giờ âm — nền tảng không đòi tiền mặt
        ngược từ nhà bán.

        `net = gross − deficit`, và `deficit` đã kẹp ở mức `gross`. Câu
        "không bao giờ âm" có trong đặc tả từ trước mà mã KHÔNG giữ: nó chỉ
        thành thật từ 23/09/2026.
    created_at:
      type: string
      format: date-time
    lines:
      type: array
      description: |
        TỪNG KHOẢN làm nên đợt này.

        Đặc tả nói thẳng ở `getMySettlement`: nhà bán phải xem được "từng
        dòng cấu thành số tiền", vì đối soát không minh bạch là nguyên nhân
        tranh chấp lớn nhất giữa nền tảng và nhà bán.

        Dữ liệu này đã nằm trong `settlement_line` từ đầu và được nạp sẵn
        mỗi lần đọc đợt; tới 23/09/2026 nó bị vứt ở tầng DTO.

        **`reference_id` là thứ làm dòng này đối chiếu được**: nó trỏ tới
        ĐƠN THỰC HIỆN mà nhà bán đã giao — chính là đơn họ thấy ở màn hình
        "Việc cần làm". Không có nó, một đợt chỉ là một con số tổng.

        Mảng rỗng và thiếu trường nói hai chuyện khác nhau, nên `[]` được
        trả về chứ không bỏ trường.
      items:
        type: object
        required: [id, amount]
        properties:
          id:
            $ref: './common.yaml#/schemas/Id'
          amount:
            $ref: './common.yaml#/schemas/Money'
          reference_type:
            type: string
            description: Với khoản rút được thì luôn là `FULFILLMENT_ORDER`.
          reference_id:
            $ref: './common.yaml#/schemas/Id'
          released_at:
            type: string
            format: date-time
            description: Lúc khoản này chuyển sang rút được.

LedgerLine:
  type: object
  description: |
    Một dòng bút toán. Trong mỗi `LedgerEntry`, **Σ DEBIT phải = Σ CREDIT**.
  required: [account_type, direction, amount]
  properties:
    account_type:
      type: string
      description: |
        MƯỜI BA tài khoản, không phải chín.

        Bản trước thiếu bốn cái được thêm ở migration 000035, 000045 và
        000048 — và `ACCOUNTS_RECEIVABLE` ĐÃ có mặt trong sổ cái thật. Một
        enum thiếu giá trị tệ hơn một chuỗi tự do: client sinh kiểu từ đặc
        tả sẽ thu hẹp kiểu sai rồi vỡ khi gặp response thật. Sửa 17/09/2026.

        Danh sách nguồn là `domain.AccountType` trong
        `payment/domain/ledger.go`, và `CHECK` của `ledger_line` cưỡng chế
        nó ở tầng database.
      enum:
        # Tài sản
        - PLATFORM_CASH
        - ACCOUNTS_RECEIVABLE
        - INVENTORY_ASSET
        # Doanh thu
        - PLATFORM_REVENUE
        # Nợ phải trả
        - SELLER_PAYABLE
        # SELLER_AVAILABLE tách khỏi SELLER_PAYABLE (migration 000035):
        # cùng là nợ phải trả nhà bán, khác nhau ở chỗ đã RÚT ĐƯỢC hay chưa.
        - SELLER_AVAILABLE
        - CREATOR_PAYABLE
        - CUSTOMER_REFUND_PAYABLE
        - SUPPLIER_PAYABLE
        - CARRIER_PAYABLE
        # Chi phí
        - COGS
        - FEE_EXPENSE
        - SHIPPING_EXPENSE
    owner_id:
      allOf:
        - $ref: './common.yaml#/schemas/Id'
      description: Chủ tài khoản (seller, creator, nhà cung cấp) nếu có.
    direction:
      type: string
      enum: [DEBIT, CREDIT]
    amount:
      $ref: './common.yaml#/schemas/Money'
