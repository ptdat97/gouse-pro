# Xác thực
#
# Access token thời hạn ngắn (15 phút) trả trong body — client giữ TRONG BỘ NHỚ.
# Refresh token thời hạn dài (30 ngày) đặt trong cookie httpOnly — JavaScript
# không đọc được, nên XSS không lấy được nó.
#
# Vì sao tách hai nơi: localStorage đọc được bằng JavaScript, nên một lỗ hổng
# XSS duy nhất là mất tài khoản. Access token trong bộ nhớ mất khi tải lại
# trang, và đó là lý do cần refresh token ở cookie.

login:
  post:
    tags: [Auth]
    summary: Đăng nhập
    description: |
      Xác thực và mở phiên.

      **Mọi lý do thất bại trả CÙNG MỘT lỗi `UNAUTHORIZED`** — email không
      tồn tại, sai mật khẩu, tài khoản bị treo. Phân biệt chúng cho client
      là để lộ email nào có tài khoản thật, biến đường đăng nhập thành công
      cụ dò danh sách người dùng.

      Ngoại lệ duy nhất: `ACCOUNT_LOCKED` — người dùng thật cần biết vì sao
      mật khẩu đúng mà vẫn không vào được.

      Refresh token đặt vào cookie `Set-Cookie: refresh_token=...;
      HttpOnly; Secure; SameSite=Strict`. **Không bao giờ** trả trong body.
    operationId: login
    security: []
    parameters:
      - $ref: '../components/common.yaml#/parameters/RequestId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            additionalProperties: false
            properties:
              email:
                type: string
                format: email
                description: |
                  Không cần chuẩn hóa trước — server tự hạ chữ thường và cắt
                  khoảng trắng.
              password:
                type: string
                minLength: 8
                description: |
                  Mật khẩu nguyên văn. **Không bao giờ** được ghi ra nhật ký,
                  kể cả khi gỡ lỗi.
    responses:
      '200':
        description: Đăng nhập thành công
        headers:
          Set-Cookie:
            description: |
              `refresh_token` với `HttpOnly`, `Secure`, `SameSite=Strict`.
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '#/AuthResult'
      '401':
        description: |
          Đăng nhập thất bại. `UNAUTHORIZED` cho mọi lý do thông thường;
          `ACCOUNT_LOCKED` khi tài khoản tạm khóa do sai mật khẩu nhiều lần.
        content:
          application/json:
            schema:
              $ref: '../components/common.yaml#/schemas/Error'
      '429':
        description: |
          Quá nhiều lượt đăng nhập THẤT BẠI từ cùng một địa chỉ mạng.

          Khác với `ACCOUNT_LOCKED` (401): 401 khóa MỘT tài khoản, 429 chặn
          MỘT đường mạng. Hai lớp bắt hai kiểu tấn công khác nhau — dò mật
          khẩu một tài khoản, và rải một mật khẩu qua nhiều tài khoản.

          Lượt đăng nhập THÀNH CÔNG không bị tính, nên người dùng thật ngồi
          sau NAT dùng chung không bao giờ chạm hạn mức này.
        headers:
          Retry-After:
            description: Số giây nên chờ trước khi thử lại.
            schema:
              type: integer
        content:
          application/json:
            schema:
              $ref: '../components/common.yaml#/schemas/Error'

refresh:
  post:
    tags: [Auth]
    summary: Làm mới phiên
    description: |
      Đổi refresh token lấy access token mới.

      **Token cũ bị thu hồi.** Nếu nó bị đánh cắp và dùng sau đó, lần dùng
      thất bại chính là dấu hiệu phát hiện được — đây là lý do xoay token
      thay vì dùng lại token cũ.

      Đọc refresh token từ cookie, không từ body.
    operationId: refreshSession
    security: []
    responses:
      '200':
        description: Phiên đã làm mới
        headers:
          Set-Cookie:
            description: Refresh token mới; token cũ đã bị thu hồi.
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '#/AuthResult'
      '401':
        description: Phiên không hợp lệ, đã thu hồi, hoặc hết hạn. Client phải đăng nhập lại.
        content:
          application/json:
            schema:
              $ref: '../components/common.yaml#/schemas/Error'

logout:
  post:
    tags: [Auth]
    summary: Đăng xuất
    description: |
      Thu hồi phiên hiện tại và xóa cookie.

      **Idempotent**: đăng xuất một phiên đã đăng xuất là thành công, vì kết
      quả mong muốn đã đạt được.
    operationId: logout
    security: []
    responses:
      '204':
        description: |
          Đã đăng xuất. Trả 204 kể cả khi phiên không tồn tại hoặc đã thu
          hồi — kết quả mong muốn đã đạt được, và báo lỗi ở đây chỉ tiết lộ
          token nào từng có thật.
        headers:
          Set-Cookie:
            description: Cookie `refresh_token` bị xóa (`Max-Age=0`).
            schema:
              type: string
      '429':
        $ref: '../components/common.yaml#/responses/TooManyRequests'

admin_me:
  get:
    tags: [Auth]
    summary: Thông tin người đang đăng nhập
    description: |
      Trả vai trò và phạm vi để giao diện dựng menu.

      **Đây CHỈ là trải nghiệm, không phải bảo mật.** Backend luôn kiểm tra
      lại quyền ở từng endpoint — người dùng có thể gọi API trực tiếp, bỏ
      qua hoàn toàn giao diện.
    operationId: getAdminMe
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Thông tin tài khoản
        content:
          application/json:
            schema:
              type: object
              required: [id, email, roles, scope]
              properties:
                id:
                  $ref: '../components/common.yaml#/schemas/Id'
                email:
                  type: string
                display_name:
                  type: string
                roles:
                  type: array
                  description: |
                    Client **phải** xử lý được vai trò chưa biết mà không
                    crash — server có thể thêm vai trò mới.
                  items:
                    type: string
                    enum:
                      - ADMIN
                      - OPS_MERCHANDISING
                      - OPS_WAREHOUSE
                      - OPS_FINANCE
                      - OPS_SUPPORT
                      - OPS_CONTENT
                scope:
                  type: string
                  enum: [OWN, SELLER, ALL]
                  description: Phạm vi rộng nhất của người dùng.
                requires_two_factor:
                  type: boolean
                  description: |
                    Vai trò `ADMIN` và `OPS_FINANCE` bắt buộc xác thực hai
                    lớp. Luồng 2FA **chưa triển khai** — trường này báo cho
                    giao diện biết tài khoản nào sẽ cần, để không phát hành
                    khi chưa có.
            example:
              id: usr_01J9XABC123DEF456GHJKMNPQR
              email: nv.hoa@example.com
              display_name: Nguyễn Thị Hoa
              roles: [OPS_FINANCE]
              scope: ALL
              requires_two_factor: true
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'

# --------------------------------------------------------------- Schema cục bộ
AuthResult:
  type: object
  required: [access_token, expires_in, user]
  properties:
    access_token:
      type: string
      description: |
        Thời hạn 15 phút. Client giữ **trong bộ nhớ**, không localStorage.

        Ngắn có chủ ý: token không tra database mỗi request, nên thu hồi
        không có hiệu lực tức thì. Mười lăm phút là khoảng thời gian tối đa
        một tài khoản đã bị treo còn dùng được.
    expires_in:
      type: integer
      description: Số giây tới khi access token hết hạn.
      examples: [900]
    user:
      type: object
      required: [id, email, roles]
      properties:
        id:
          $ref: '../components/common.yaml#/schemas/Id'
        email:
          type: string
        display_name:
          type: string
        roles:
          type: array
          items:
            type: string

register:
  post:
    tags: [Auth]
    summary: Đăng ký tài khoản khách hàng
    description: |
      Một lần gọi tạo **hai thứ ở hai module**: tài khoản đăng nhập
      (`identity`) và hồ sơ mua hàng (`customer`).

      **KHÔNG trả token.** Client phải gọi `login` ngay sau đó. Phát hành
      token là việc của module `identity`; làm ở đây nghĩa là nhân bản logic
      quản lý phiên ra chỗ thứ hai.

      **Email đã từng dùng để đặt hàng vãng lai sẽ bị TỪ CHỐI** (`409`).
      Hồ sơ cũ có thể chứa lịch sử mua hàng và địa chỉ nhà; gắn nó vào tài
      khoản vừa đăng ký nghĩa là bất kỳ ai biết email người khác đều đọc
      được những thứ đó. Gộp chỉ được phép **sau khi xác minh quyền sở hữu
      email**, và luồng đó nay ĐÃ CÓ — xem `verifyEmail` (P3-15, 07/09).

      **Đăng ký bằng email đã đặt hàng vãng lai nay ĐƯỢC PHÉP.** Tài khoản
      tạo ngay và dùng được; thứ bị hoãn là việc GỘP lịch sử. Phản hồi
      `201` mang `email_verification_required: true` để giao diện nói cho
      khách biết còn một bước nữa và lịch sử cũ đang chờ ở đó.

      Trước 07/09 đường này trả `409` cho trường hợp đó, và nó để khách ở
      ngõ cụt: không tạo được tài khoản bằng chính email của mình.

      **Giới hạn tần suất BẮT BUỘC.** Endpoint này cố ý phân biệt "email đã
      có tài khoản" với "email chưa dùng" — người dùng thật cần biết vì sao
      không đăng ký được. Cái giá là nó trả lời được câu "email này có tài
      khoản chưa", nên không giới hạn thì nó là công cụ dò danh sách email.
    operationId: registerCustomer
    security:
      - {}
    parameters:
      - $ref: '../components/common.yaml#/parameters/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email:
                type: string
                format: email
              password:
                type: string
                format: password
                minLength: 8
              name:
                type: string
              phone:
                type: string
    responses:
      '201':
        description: Đã tạo tài khoản. Gọi `login` để lấy token.
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, user_id]
              properties:
                customer_id:
                  $ref: '../components/common.yaml#/schemas/Id'
                user_id:
                  $ref: '../components/common.yaml#/schemas/Id'
                email_verification_required:
                  type: boolean
                  description: |
                    `true` khi email này ĐÃ có đơn hàng vãng lai. Tài khoản
                    dùng được ngay, nhưng lịch sử cũ chỉ hiện ra sau khi
                    khách bấm liên kết trong thư — xem `verifyEmail`.

                    Vắng mặt hoặc `false` nghĩa là không có gì đang chờ.
      '409':
        description: |
          Email này đã có **tài khoản** → đăng nhập, hoặc quên mật khẩu.

          Trường hợp "đã đặt hàng vãng lai" KHÔNG còn trả `409` từ 07/09
          (P3-15): nó trả `201` kèm `email_verification_required: true`.
        content:
          application/json:
            schema:
              $ref: '../components/common.yaml#/schemas/Error'
      '422':
        $ref: '../components/common.yaml#/responses/UnprocessableEntity'
      '429':
        description: Vượt giới hạn tần suất. Header `Retry-After` cho biết chờ bao lâu.
        content:
          application/json:
            schema:
              $ref: '../components/common.yaml#/schemas/Error'

verify_email:
  post:
    tags: [Auth]
    summary: Xác minh email và gộp lịch sử đơn vãng lai
    description: |
      Đổi token trong thư lấy việc **xác minh email**, rồi gắn mọi **đơn
      vãng lai** của địa chỉ đó vào hồ sơ khách hàng.

      **Vì sao bước này tồn tại.** Đơn hàng chứa địa chỉ nhà và số điện
      thoại người nhận. Gắn chúng vào một tài khoản chỉ vì tài khoản đó
      khai cùng email nghĩa là bất kỳ ai biết email người khác đều đọc được
      những thứ đó. Bấm được liên kết trong hộp thư là bằng chứng đọc được
      hộp thư — điều kiện tối thiểu.

      **KHÔNG cần đăng nhập.** Người bấm liên kết thường ở trình duyệt khác
      hoặc trên điện thoại; bắt đăng nhập trước là đẩy họ qua đúng bước mà
      luồng này tồn tại để giúp họ vượt qua. Token đã là bằng chứng: ngẫu
      nhiên 256 bit, **dùng một lần**, hết hạn sau **24 giờ**.

      **Chỉ đụng đơn CHƯA có chủ.** Đơn đã thuộc về một khách khác không
      bao giờ bị chuyển, kể cả khi trùng email.

      **Giới hạn tần suất bắt buộc:** endpoint nhận token từ bên ngoài, nên
      không giới hạn thì nó là chỗ dò token bằng vét cạn.
    operationId: verifyEmail
    security:
      - {}
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            properties:
              token:
                type: string
                description: Token nguyên văn lấy từ liên kết trong thư.
    responses:
      '200':
        description: Đã xác minh email.
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                profile_merged:
                  type: boolean
                  description: |
                    Hồ sơ khách vãng lai có sẵn vừa được gắn vào tài khoản.
                    Thường `false`: khách vãng lai KHÔNG có hồ sơ, lịch sử
                    của họ nằm ở các ĐƠN — xem `orders_merged`.
                orders_merged:
                  type: integer
                  description: |
                    SỐ ĐƠN cũ vừa về với khách — thứ họ thật sự chờ.

                    Trả con số chứ không chỉ true/false: "đã tìm thấy 3 đơn
                    cũ" là câu khách kiểm chứng được ngay.
      '400':
        description: |
          Token không hợp lệ, đã dùng, hoặc đã hết hạn.

          **MỘT thông báo cho cả ba**, có chủ ý: phân biệt chúng cho kẻ dò
          biết token nào TỪNG có thật, và từ đó biết email nào đang chờ xác
          minh. Thông báo vẫn nêu hành động cần làm ("yêu cầu gửi lại"), vì
          người dùng thật gặp lỗi này chủ yếu do liên kết quá 24 giờ.
        content:
          application/json:
            schema:
              $ref: '../components/common.yaml#/schemas/Error'
      '429':
        description: Vượt giới hạn tần suất.
        content:
          application/json:
            schema:
              $ref: '../components/common.yaml#/schemas/Error'

resend_verification_email:
  post:
    tags: [Auth]
    summary: Gửi lại liên kết xác minh email
    description: |
      Phát token mới và gửi lại thư xác minh. Token cũ bị **vô hiệu** —
      người ta bấm "gửi lại" chính vì nghi ngờ thư cũ, nên để hai liên kết
      cùng sống là làm ngược điều họ vừa yêu cầu.

      **CẦN ĐĂNG NHẬP**, khác `verifyEmail`. Hai đường nhận hai thứ khác
      nhau: đường kia nhận TOKEN — bản thân nó đã là bằng chứng. Đường này
      nếu nhận EMAIL thì bất kỳ ai cũng hỏi được "địa chỉ này có tài khoản
      chưa" qua việc phản hồi khác nhau, tức là công cụ dò danh sách email.
      Lấy danh tính từ token đăng nhập thì không có gì để dò.

      Yêu cầu đăng nhập KHÔNG chặn ai: tài khoản dùng được ngay từ lúc
      đăng ký, kể cả khi email chưa xác minh. Thứ chưa có là lịch sử đơn cũ.
    operationId: resendVerificationEmail
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Đã gửi lại thư.
        content:
          application/json:
            schema:
              type: object
              properties:
                sent:
                  type: boolean
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '409':
        description: |
          Email đã được xác minh — không cần gửi lại.

          Nói thẳng ra được vì người gọi đã đăng nhập: đây là email của
          chính họ, không lộ gì cho ai.
        content:
          application/json:
            schema:
              $ref: '../components/common.yaml#/schemas/Error'
      '429':
        description: Vượt giới hạn tần suất.
        content:
          application/json:
            schema:
              $ref: '../components/common.yaml#/schemas/Error'
