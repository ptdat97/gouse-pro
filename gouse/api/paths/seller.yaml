# Seller Center API
#
# RÀNG BUỘC BẢO MẬT QUAN TRỌNG NHẤT:
#   Seller KHÔNG BAO GIỜ thấy dữ liệu của seller khác, kể cả gián tiếp
#   qua báo cáo tổng hợp có thể suy ngược.
#
# Token chứa seller_id. Mọi truy vấn tự động lọc theo seller_id này
# ở TẦNG REPOSITORY, không phải ở tầng hiển thị.

# `/api/v1/sellers` là MỘT tài nguyên với hai thao tác:
#
#   GET   tra hồ sơ công khai theo lô  (trang sản phẩm dùng)
#   POST  đăng ký làm nhà bán
#
# Chúng ở chung một node vì OpenAPI khai theo ĐƯỜNG DẪN, không theo nhóm
# chức năng. Tách ra hai khóa `/api/v1/sellers` là YAML trùng khóa — bản
# sau lặng lẽ đè bản trước.
sellers:
  get:
    tags: [Catalog]
    summary: Tra hồ sơ nhà bán theo lô
    description: |
      Đổi danh sách `seller_id` lấy thông tin hiển thị cho khách.

      **Tra theo LÔ, không phải từng cái.** Trang chi tiết sản phẩm hiện N
      offer của N nhà bán; một endpoint `/sellers/{id}` buộc trang gọi N
      lần. Endpoint offer cố ý chỉ trả `seller_id` — ghép dữ liệu là việc
      của TRANG, không phải của ENDPOINT.

      **Chỉ trả trường công khai.** Tên pháp lý, mã số thuế, liên hệ và tỷ
      lệ hoa hồng là điều khoản thương mại giữa nền tảng và nhà bán, chỉ có
      ở `/api/v1/admin/sellers/{id}`.

      Mã sai định dạng hoặc không tồn tại bị **bỏ qua**, không làm hỏng cả
      lời gọi: trang đang hiển thị một danh sách, và một mã hỏng không đáng
      để cả danh sách trống. Thứ tự kết quả giữ đúng thứ tự hỏi.
    operationId: lookupSellers
    security:
      - bearerAuth: []
      - {}
    parameters:
      - name: ids
        in: query
        required: true
        description: Danh sách mã nhà bán, ngăn cách bằng dấu phẩy. Tối đa 50.
        schema:
          type: string
        example: sel_01J9XABC123DEF456GHJKMNPQR,sel_01J9XABC123DEF456GHJKMNPQS
    responses:
      '200':
        description: Hồ sơ công khai của các nhà bán tìm thấy
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas.yaml#/SellerRef'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
  post:
    tags: [Seller]
    summary: Đăng ký làm nhà bán
    description: |
      Endpoint này thuộc nhóm storefront (người dùng thường đăng ký),
      không phải nhóm seller.

      **Xác minh tài khoản ngân hàng là bắt buộc** trước khi duyệt — sai
      tài khoản nghĩa là chuyển tiền nhầm người, rất khó thu hồi. Tên chủ
      tài khoản phải khớp tên doanh nghiệp/cá nhân đăng ký.
    operationId: applyAsSeller
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/common.yaml#/parameters/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [seller_type, business_name, contact_email, contact_phone, bank_account]
            properties:
              seller_type:
                type: string
                enum: [INDIVIDUAL, BUSINESS, LOCAL_BRAND, STRATEGIC_PARTNER]
                description: |
                  Bốn loại khác nhau ở **chính sách**, không ở cấu trúc dữ liệu.
                  Seller cá nhân có thể phát triển thành local brand mà không
                  cần di trú dữ liệu.
              business_name:
                type: string
              tax_id:
                type: string
                description: Bắt buộc với BUSINESS trở lên.
              contact_email:
                type: string
                format: email
              contact_phone:
                type: string
              documents:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [BUSINESS_LICENSE, TAX_CERTIFICATE, ID_CARD, BRAND_AUTHORIZATION]
                    file_url:
                      type: string
                      format: uri
              bank_account:
                type: object
                required: [bank_code, account_number, account_holder]
                properties:
                  bank_code:
                    type: string
                  account_number:
                    type: string
                  account_holder:
                    type: string
    responses:
      '201':
        description: Hồ sơ đã nộp, chờ duyệt
        content:
          application/json:
            schema:
              type: object
              properties:
                seller:
                  type: object
                  properties:
                    id:
                      $ref: '../components/common.yaml#/schemas/Id'
                    status:
                      type: string
                      enum: [PENDING_REVIEW]
                    applied_at:
                      $ref: '../components/common.yaml#/schemas/Timestamp'
                next_steps:
                  type: array
                  items:
                    type: string
            example:
              seller:
                id: sel_01J9XABC123DEF456GHJKMNPQR
                status: PENDING_REVIEW
                applied_at: '2026-08-11T09:00:00Z'
              next_steps:
                - Chờ duyệt hồ sơ (1–3 ngày làm việc)
                - Xác minh tài khoản ngân hàng
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'

offers:
  get:
    tags: [Seller]
    summary: Danh sách offer của tôi
    operationId: listMyOffers
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/common.yaml#/parameters/Limit'
      - $ref: '../components/common.yaml#/parameters/Cursor'
      - name: status
        in: query
        schema:
          type: string
          enum: [DRAFT, ACTIVE, SUSPENDED, ARCHIVED]
    responses:
      '200':
        description: Danh sách offer
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas.yaml#/SellerOffer'
                pagination:
                  $ref: '../components/common.yaml#/schemas/CursorPagination'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'

  post:
    tags: [Seller]
    summary: Tạo offer
    description: |
      Tạo lời chào bán cho một SKU **đã có** trong danh mục.

      Ba lớp kiểm soát:

      1. **Bảo vệ thương hiệu** — thương hiệu `VERIFIED_ONLY` yêu cầu giấy
         ủy quyền còn hiệu lực. Đây là quy tắc domain bắt buộc, không phải
         quy trình thủ công.
      2. **Khung giá** — chống bán phá giá và **lỗi nhập liệu** (thiếu số 0).
      3. **Một seller một offer active cho một SKU.**
    operationId: createOffer
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/common.yaml#/parameters/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [sku_id, price]
            properties:
              sku_id:
                $ref: '../components/common.yaml#/schemas/Id'
              price:
                $ref: '../components/common.yaml#/schemas/Money'
              compare_at_price:
                $ref: '../components/common.yaml#/schemas/Money'
              condition:
                type: string
                enum: [NEW, USED_LIKE_NEW, USED_GOOD]
                default: NEW
              handling_time_hours:
                type: integer
                default: 24
                description: Thời gian seller cần để chuẩn bị hàng.
              min_order_quantity:
                type: integer
                default: 1
              max_order_quantity:
                type: integer
              initial_inventory:
                type: object
                properties:
                  stock_location_id:
                    $ref: '../components/common.yaml#/schemas/Id'
                  quantity:
                    type: integer
    responses:
      '201':
        description: Offer đã tạo
        content:
          application/json:
            schema:
              type: object
              properties:
                offer:
                  $ref: '../components/schemas.yaml#/SellerOffer'
      '403':
        description: Không được phép bán thương hiệu này
        content:
          application/json:
            schema:
              $ref: '../components/common.yaml#/schemas/Error'
            example:
              error:
                code: BRAND_PROTECTED
                message: Thương hiệu này yêu cầu giấy ủy quyền
                details:
                  brand_id: brd_01J9XABC123DEF456GHJKMNPQR
                  protection_level: VERIFIED_ONLY
                  required_action: UPLOAD_AUTHORIZATION
              request_id: req_01J9XABC123DEF456GHJKMNPQR
      '409':
        description: Đã có offer active cho SKU này
        content:
          application/json:
            schema:
              $ref: '../components/common.yaml#/schemas/Error'
      '422':
        description: Giá ngoài khung cho phép
        content:
          application/json:
            schema:
              $ref: '../components/common.yaml#/schemas/Error'
            example:
              error:
                code: PRICE_OUT_OF_RANGE
                message: Giá nằm ngoài khung cho phép
                details:
                  min_price: 150000
                  max_price: 600000
                  submitted: 50000
                  hint: Bạn có nhập thiếu số 0 không?
              request_id: req_01J9XABC123DEF456GHJKMNPQR

offer_detail:
  patch:
    tags: [Seller]
    summary: Cập nhật offer
    description: |
      Mọi thay đổi giá được ghi vào lịch sử giá — dùng để phát hiện thao túng
      giá (tăng rồi giảm để giả vờ khuyến mãi).
    operationId: updateOffer
    security:
      - bearerAuth: []
    parameters:
      - name: offer_id
        in: path
        required: true
        schema:
          $ref: '../components/common.yaml#/schemas/Id'
      - $ref: '../components/common.yaml#/parameters/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              price:
                $ref: '../components/common.yaml#/schemas/Money'
              compare_at_price:
                $ref: '../components/common.yaml#/schemas/Money'
              handling_time_hours:
                type: integer
              status:
                type: string
                enum: [ACTIVE, ARCHIVED]
    responses:
      '200':
        description: Offer đã cập nhật
        content:
          application/json:
            schema:
              type: object
              properties:
                offer:
                  $ref: '../components/schemas.yaml#/SellerOffer'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '422':
        $ref: '../components/common.yaml#/responses/UnprocessableEntity'

inventory_item:
  put:
    tags: [Seller]
    summary: Cập nhật tồn kho
    description: |
      Đặt **giá trị tuyệt đối**, không phải cộng trừ — idempotent tự nhiên,
      gọi lại không làm sai lệch.

      Trường `reason` bắt buộc và được ghi vào nhật ký biến động tồn kho.

      **PUT chứ không phải PATCH** — và đây không phải chuyện thẩm mỹ. PATCH
      nghĩa là "sửa phần này", đọc lại hai lần thì cộng hai lần. Ở đây thân
      yêu cầu là toàn bộ trạng thái mong muốn: gửi mười lần vẫn ra đúng con
      số đã đếm. Đường mạng chập chờn ở kho là chuyện thường, nên tính chất
      này phải nằm trong giao thức chứ không nằm ở chỗ khách gọi cẩn thận.
    operationId: updateInventory
    security:
      - bearerAuth: []
    parameters:
      - name: sku_id
        in: path
        required: true
        schema:
          $ref: '../components/common.yaml#/schemas/Id'
      - $ref: '../components/common.yaml#/parameters/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [quantity_available, reason]
            properties:
              stock_location_id:
                $ref: '../components/common.yaml#/schemas/Id'
              quantity_available:
                type: integer
                minimum: 0
                description: Giá trị tuyệt đối, không phải delta.
              reason:
                type: string
                minLength: 5
                examples: ['Kiểm kê thực tế']
    responses:
      '200':
        description: Tồn kho đã cập nhật
        content:
          application/json:
            schema:
              type: object
              required: [sku_id, quantity_available, updated_at]
              properties:
                sku_id:
                  $ref: '../components/common.yaml#/schemas/Id'
                quantity_available:
                  type: integer
                  description: |
                    Con số THỰC TẾ sau khi ghi, đọc lại từ kho lưu trữ. Có
                    thể KHÁC con số vừa gửi nếu có đơn hàng chen vào giữa —
                    giao diện phải hiện con số này, không phải con số đã gõ.
                updated_at:
                  allOf:
                    - $ref: '../components/common.yaml#/schemas/Timestamp'
                  description: |
                    Lúc con số **thay đổi** lần cuối — không phải lúc **đếm**
                    lần cuối. Kiểm kê ra đúng số đang có là việc không-làm-gì
                    (cố ý: một lần đếm xác nhận không được đẻ ra bản ghi biến
                    động giả), nên mốc này đứng yên.
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'

fulfillment_orders:
  get:
    tags: [Seller]
    summary: Danh sách đơn cần xử lý
    description: |
      Seller thấy **FulfillmentOrder**, không phải **Order**.

      Đây là ranh giới bảo mật nằm trong **cấu trúc dữ liệu**, không phụ thuộc
      vào việc nhớ lọc ở tầng hiển thị.

      Seller **không** thấy: mã đơn tổng, tổng tiền cả đơn, các lô hàng khác
      trong cùng đơn, tên seller khác, email khách, lịch sử mua hàng.
    operationId: listMyFulfillmentOrders
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/common.yaml#/parameters/Limit'
      - $ref: '../components/common.yaml#/parameters/Cursor'
      - name: status
        in: query
        schema:
          $ref: '../components/schemas.yaml#/FulfillmentStatus'
      - name: overdue_only
        in: query
        description: Chỉ đơn quá hạn cam kết xử lý (SLA).
        schema:
          type: boolean
    responses:
      '200':
        description: Danh sách đơn thực hiện
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/SellerFulfillmentOrder'
                pagination:
                  $ref: '../components/common.yaml#/schemas/CursorPagination'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'

fulfillment_order_detail:
  get:
    tags: [Seller]
    summary: Chi tiết đơn thực hiện
    operationId: getMyFulfillmentOrder
    security:
      - bearerAuth: []
    parameters:
      - name: fulfillment_order_id
        in: path
        required: true
        schema:
          $ref: '../components/common.yaml#/schemas/Id'
    responses:
      '200':
        description: Chi tiết đơn thực hiện
        content:
          application/json:
            schema:
              $ref: '#/SellerFulfillmentOrder'
            example:
              id: ful_01J9XABC123DEF456GHJKMNPQR
              fulfillment_number: FC-2026-08-001234-B
              status: PENDING
              created_at: '2026-08-11T14:25:11Z'
              sla_deadline: '2026-08-13T14:25:11Z'
              sla_breached: false
              items:
                - sku_id: sku_01J9XABC123DEF456GHJKMNPQR
                  sku_code: LF-DA-BRN-39
                  product_name: Giày loafer da
                  variant_description: Nâu / 39
                  quantity: 1
                  unit_price:
                    amount: 650000
                    currency: VND
              shipping_address:
                recipient_name: Nguyễn Văn A
                phone: '+84901234567'
                street_address: 123 Đường ABC
                ward: Phường X
                district: Quận Y
                province: TP.HCM
                country_code: VN
              shipping_method: STANDARD
              payout_estimate:
                gross:
                  amount: 650000
                  currency: VND
                commission:
                  amount: -52000
                  currency: VND
                payment_fee:
                  amount: -9750
                  currency: VND
                net:
                  amount: 588250
                  currency: VND
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'

fulfillment_order_ship:
  post:
    tags: [Seller]
    summary: Bàn giao vận chuyển
    operationId: shipFulfillmentOrder
    security:
      - bearerAuth: []
    parameters:
      - name: fulfillment_order_id
        in: path
        required: true
        schema:
          $ref: '../components/common.yaml#/schemas/Id'
      - $ref: '../components/common.yaml#/parameters/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [tracking_number, shipping_provider]
            properties:
              tracking_number:
                type: string
              shipping_provider:
                type: string
              shipped_at:
                $ref: '../components/common.yaml#/schemas/Timestamp'
    responses:
      '200':
        description: Đã ghi nhận bàn giao
        content:
          application/json:
            schema:
              $ref: '#/SellerFulfillmentOrder'
      '409':
        $ref: '../components/common.yaml#/responses/Conflict'

return_inspect:
  post:
    tags: [Seller]
    summary: Ghi kết quả kiểm định hàng hoàn
    description: |
      Đóng mắt xích CUỐI của luồng trả hàng.

      Hàng hoàn về kho nằm ở trạng thái `Returned` — **không bao giờ** tự
      động vào `Available`. Bán lại hàng hỏng cho khách khác gây thiệt hại
      uy tín lớn hơn nhiều lần giá trị món hàng.

      Không có bước này thì mọi món hàng hoàn nằm chết vĩnh viễn: nhà bán
      mất cả hàng lẫn tiền.

      **Kết quả quyết định hàng đi đâu:**

      | `passed` | Hàng vào | Ý nghĩa |
      |---|---|---|
      | `true`  | `Available` | Còn nguyên tem mác, bán lại được |
      | `false` | `Damaged`   | Hỏng, bẩn, thiếu phụ kiện |

      Kiểm theo TỪNG DÒNG: một yêu cầu trả hai món hoàn toàn có thể một
      món bán lại được và một món hỏng.
    operationId: inspectReturn
    security:
      - bearerAuth: []
    parameters:
      - name: return_id
        in: path
        required: true
        schema:
          $ref: '../components/common.yaml#/schemas/Id'
      - $ref: '../components/common.yaml#/parameters/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [lines]
            properties:
              lines:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [order_line_id, passed]
                  properties:
                    order_line_id:
                      $ref: '../components/common.yaml#/schemas/Id'
                    passed:
                      type: boolean
                    note:
                      type: string
                      description: |
                        Bắt buộc khi `passed = false`. Lý do loại hàng là
                        đầu vào cho việc làm việc với nhà cung cấp.
    responses:
      '200':
        description: Đã ghi kết quả kiểm định
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '409':
        description: |
          Yêu cầu chưa tới bước kiểm định, hoặc đã kiểm rồi.
        content:
          application/json:
            schema:
              $ref: '../components/common.yaml#/schemas/Error'

fulfillment_order_deliver:
  post:
    tags: [Seller]
    summary: Xác nhận đã giao tới khách
    description: |
      Đóng mắt xích cuối của vòng đời đơn hàng.

      Từ đây bắt đầu đếm **hạn đổi trả**. Hết hạn mà không có yêu cầu trả,
      job nền chuyển đơn sang `COMPLETED` và số dư seller từ `Pending` sang
      `Available` — xem `docs/07-workflows/marketplace-order.md` mục 6.

      **Tạm thời do seller tự xác nhận.** Nguồn đáng tin hơn là webhook của
      hãng vận chuyển (`receiveShippingWebhook`), chưa cài. Khi có webhook,
      thao tác này vẫn giữ lại cho hàng seller tự giao.
    operationId: deliverFulfillmentOrder
    security:
      - bearerAuth: []
    parameters:
      - name: fulfillment_order_id
        in: path
        required: true
        schema:
          $ref: '../components/common.yaml#/schemas/Id'
      - $ref: '../components/common.yaml#/parameters/IdempotencyKey'
    responses:
      '200':
        description: Đã ghi nhận giao hàng
        content:
          application/json:
            schema:
              $ref: '#/SellerFulfillmentOrder'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '409':
        $ref: '../components/common.yaml#/responses/Conflict'

balance:
  get:
    tags: [Seller]
    summary: Số dư của tôi
    description: |
      Năm trạng thái số dư. Hiển thị đủ giúp seller hiểu **vì sao chưa nhận
      được tiền** — giảm khiếu nại đáng kể.

      Nguồn sự thật duy nhất là module `payment`. Không module nào khác
      được tự cộng trừ bản ghi để tính số dư.
    operationId: getMyBalance
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Số dư theo năm trạng thái
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/SellerBalance'
            example:
              currency: VND
              pending:
                amount: 2450000
                currency: VND
              available:
                amount: 8320000
                currency: VND
              processing:
                amount: 0
                currency: VND
              on_hold:
                amount: 0
                currency: VND
              reserve_held:
                amount: 500000
                currency: VND
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'

settlement_detail:
  get:
    tags: [Seller]
    summary: Chi tiết đối soát
    description: |
      Seller phải xem được **từng dòng** cấu thành số tiền — đối soát không
      minh bạch là nguyên nhân tranh chấp lớn nhất giữa nền tảng và nhà bán.

      `net_payout` có thể **âm** khi hoàn hàng vượt doanh thu kỳ; khoản âm
      chuyển sang kỳ sau, không chuyển tiền âm.
    operationId: getMySettlement
    security:
      - bearerAuth: []
    parameters:
      - name: settlement_id
        in: path
        required: true
        schema:
          $ref: '../components/common.yaml#/schemas/Id'
    responses:
      '200':
        description: Chi tiết đối soát
        content:
          application/json:
            schema:
              type: object
              required: [settlement]
              properties:
                settlement:
                  $ref: '../components/schemas.yaml#/Settlement'
            example:
              settlement:
                id: stl_01J9XABC123DEF456GHJKMNPQR
                status: CONFIRMED
                currency: VND
                period_start: '2026-08-01T00:00:00Z'
                period_end: '2026-08-07T23:59:59Z'
                gross_amount:
                  amount: 12500000
                  currency: VND
                deficit_amount:
                  amount: 890000
                  currency: VND
                net_amount:
                  amount: 11610000
                  currency: VND
                created_at: '2026-08-08T01:00:00Z'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'

performance:
  get:
    tags: [Seller]
    summary: Hiệu suất của tôi
    description: |
      Chỉ số, ngưỡng, và **tác động** đều công khai và tường minh.

      Seller cần hiểu vì sao mình không thắng buy box và cần làm gì để
      cải thiện. Mô hình chấm điểm hộp đen tạo tranh chấp không giải quyết
      được và cảm giác bất công.
    operationId: getMyPerformance
    security:
      - bearerAuth: []
    parameters:
      - name: period
        in: query
        schema:
          type: string
          enum: [LAST_7_DAYS, LAST_30_DAYS, LAST_90_DAYS]
          default: LAST_30_DAYS
    responses:
      '200':
        description: Chỉ số hiệu suất
        content:
          application/json:
            schema:
              type: object
              properties:
                period:
                  type: string
                metrics:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      value:
                        type: number
                      threshold:
                        type: number
                      status:
                        type: string
                        enum: [GOOD, WARNING, CRITICAL]
                sample_size:
                  type: integer
                  description: |
                    Số đơn thực hiện trong kỳ, tức MẪU dùng để tính mọi tỷ
                    lệ ở trên.

                    Bắt buộc có: "tỷ lệ hủy 5%" mà không nói của bao nhiêu
                    đơn là một khẳng định không kiểm chứng được, và đó
                    chính là hộp đen mà endpoint này sinh ra để tránh.

                    Mẫu dưới ngưỡng tối thiểu thì `metrics` TRỐNG — chấm
                    một gian hàng mới mở là NGHIÊM TRỌNG vì họ hủy đúng
                    một đơn là bất công.
                shipping_sla_hours:
                  type: number
                  description: |
                    Thước đo dùng để quyết định một đơn có "đúng hạn" hay
                    không, tính từ lúc đơn thực hiện được tạo.

                    Trả ra để nhà bán luôn đọc được tiêu chí đang dùng để
                    chấm mình.
                not_measured:
                  type: array
                  description: |
                    MỌI chỉ số không có trong `metrics`, kèm lý do. Hai
                    loại lý do, và chúng khác nhau về bản chất:

                    - **thiếu nguồn dữ liệu** — vĩnh viễn cho tới khi có
                      người xây (`average_rating`, `buy_box_win_rate`…)
                    - **chưa đủ mẫu** — đo được, nhưng kỳ này quá ít đơn
                      để con số có nghĩa. Tự hết khi gian hàng bán thêm.
                      Lý do nêu rõ cần bao nhiêu và hiện có bao nhiêu.

                    Loại thứ hai thêm 17/09/2026. Trước đó một chỉ số đo
                    được mà thiếu mẫu chỉ đơn giản BIẾN MẤT khỏi `metrics`
                    không một lời — nhà bán không có cách nào biết vì sao,
                    tức đúng thứ hộp đen endpoint này sinh ra để tránh, chỉ
                    khác là ở phía người viết API.

                    Bất biến: mỗi chỉ số đo được nằm ở ĐÚNG MỘT trong hai
                    danh sách, không bao giờ cả hai và không bao giờ không
                    danh sách nào (`TestKhongChiSoNaoVuaDoVuaChuaDo`).
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      reason:
                        type: string
                impact:
                  type: object
                  properties:
                    message:
                      type: string
                      description: |
                        Việc NÊN LÀM tiếp theo, không chỉ tình trạng hiện
                        tại. Nêu đúng MỘT chỉ số tệ nhất: một danh sách
                        việc cần làm dài thì không ai biết bắt đầu từ đâu.
            example:
              period: LAST_30_DAYS
              metrics:
                - name: cancellation_rate
                  value: 0.021
                  threshold: 0.03
                  status: GOOD
                - name: on_time_shipping_rate
                  value: 0.94
                  threshold: 0.95
                  status: WARNING
              sample_size: 240
              shipping_sla_hours: 48
              not_measured:
                - name: return_rate_description
                  reason: >-
                    cần dữ liệu của module returns; đó là module ở tầng khác
                    nên phải qua một read model chung, chưa dựng
                - name: average_rating
                  reason: hệ thống chưa có đánh giá của khách
                - name: inventory_accuracy
                  reason: chưa thống nhất công thức tính lệch kiểm kê
                - name: buy_box_win_rate
                  reason: >-
                    buy box tính tại thời điểm hỏi và không được lưu lại,
                    nên không có lịch sử để tính tỷ lệ
              impact:
                message: >-
                  Giao đúng hạn đang ở 94%, dưới ngưỡng 95%. Hạn bàn giao là
                  48 giờ kể từ khi đơn được tạo.
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'

# --------------------------------------------------------------- Schema cục bộ
SellerFulfillmentOrder:
  type: object
  description: |
    Đơn thực hiện — góc nhìn của seller.

    **Cố ý KHÔNG chứa:** `order_id`, tổng tiền đơn, các lô khác, tên seller
    khác, email khách, lịch sử mua hàng.
  required: [id, fulfillment_number, status, items]
  properties:
    id:
      $ref: '../components/common.yaml#/schemas/Id'
    fulfillment_number:
      type: string
      examples: ['FC-2026-08-001234-B']
    status:
      $ref: '../components/schemas.yaml#/FulfillmentStatus'
    created_at:
      $ref: '../components/common.yaml#/schemas/Timestamp'
    sla_deadline:
      allOf:
        - $ref: '../components/common.yaml#/schemas/Timestamp'
      description: |
        Hạn nhà bán phải **bàn giao cho đơn vị vận chuyển**. Trễ ảnh hưởng
        chỉ số hiệu suất.

        **TÍNH RA** từ `created_at + SLA`, không lưu thành cột. Đặc tả yêu
        cầu "chỉ số, ngưỡng, và tác động đều công khai và tường minh" — một
        thời hạn riêng cho từng đơn mà không ai nhìn thấy chính là hộp đen.

        Hệ quả phải biết: đổi `fulfillment.shipping_sla_hours` từ giao diện
        quản trị làm **dời hạn của mọi đơn đang chạy**, không chỉ đơn mới.
        Đó là cùng hành vi mà điểm hiệu suất đã có.

        Dùng CÙNG công thức với phép chấm điểm (`shipped_at <= created_at +
        SLA`), nên con số trên màn hình và con số trong báo cáo không lệch
        nhau.
    sla_breached:
      type: boolean
      description: |
        Đơn **chưa bàn giao** và đã quá hạn — việc cần làm ngay.

        Đơn đã bàn giao muộn **không** mang cờ này: việc đó đã tính vào
        điểm hiệu suất, và hiện lại nhãn trễ trên một đơn đang đi đường chỉ
        làm nhà bán tưởng còn việc phải làm. Đơn đã hủy cũng không.
    items:
      type: array
      items:
        type: object
        properties:
          sku_id:
            $ref: '../components/common.yaml#/schemas/Id'
          sku_code:
            type: string
            description: '**CHƯA được trả về** — payload event chưa mang trường này.' 
          product_name:
            type: string
          variant_description:
            type: string
          quantity:
            $ref: '../components/common.yaml#/schemas/Quantity'
          unit_price:
            $ref: '../components/common.yaml#/schemas/Money'
    shipping_address:
      allOf:
        - $ref: '../components/common.yaml#/schemas/Address'
      description: |
        Chỉ thông tin **cần cho việc giao hàng**: người nhận, số điện thoại
        (gọi trước khi giao) và địa chỉ.

        **KHÔNG có email khách.** Email không giúp giao hàng, và mọi trường
        thừa ở đây là dữ liệu cá nhân trao cho một bên thứ ba không cần tới
        nó. Đơn thực hiện có lưu email ở `notify_email` cho module
        notification, nhưng trường đó **không bao giờ** ra tới API này.

        **Vắng mặt** với đơn tách trước khi trường này ra đời — giao diện
        phải nói rõ với seller thay vì in phiếu trống.
    shipping_method:
      type: string
    tracking_number:
      type: [string, "null"]
    subtotal:
      allOf:
        - $ref: '../components/common.yaml#/schemas/Money'
      description: Tiền hàng phần CỦA SELLER NÀY, không phải tổng đơn.
    commission_amount:
      $ref: '../components/common.yaml#/schemas/Money'
    seller_payable:
      allOf:
        - $ref: '../components/common.yaml#/schemas/Money'
      description: |
        Tiền hàng trừ hoa hồng. Hiển thị NGAY từ lúc nhận đơn tạo minh bạch
        và giảm tranh chấp về sau.
    shipping_provider:
      type: [string, "null"]
    confirmed_at:
      $ref: '../components/common.yaml#/schemas/Timestamp'
    packed_at:
      $ref: '../components/common.yaml#/schemas/Timestamp'
    shipped_at:
      allOf:
        - $ref: '../components/common.yaml#/schemas/Timestamp'
      description: |
        Thời điểm bàn giao vận chuyển. Rỗng nghĩa là **chưa gửi** — giao
        diện dùng nó để tách "việc cần làm" khỏi "đã xong".
    delivered_at:
      $ref: '../components/common.yaml#/schemas/Timestamp'
    payout_estimate:
      type: object
      description: |
        Ước tính chi tiết sau khi trừ MỌI khoản phí.

        **CHƯA được trả về** — phí thanh toán và phí thực hiện chưa có
        nguồn tính. Ba trường phẳng ở trên là thứ tính được hôm nay.
      properties:
        gross:
          $ref: '../components/common.yaml#/schemas/Money'
        commission:
          $ref: '../components/common.yaml#/schemas/Money'
        payment_fee:
          $ref: '../components/common.yaml#/schemas/Money'
        fulfillment_fee:
          $ref: '../components/common.yaml#/schemas/Money'
        net:
          $ref: '../components/common.yaml#/schemas/Money'

# ---------------------------------------------------------- Sản phẩm (P3-25)
#
# Đường B của docs/07-workflows/product-publishing.md: nhà bán tạo sản
# phẩm MỚI thay vì chào bán trên sản phẩm có sẵn.
#
# Mọi endpoint ở đây kẹp theo `seller_id` LẤY TỪ TOKEN, không nhận từ thân
# request — nhận từ thân nghĩa là nhà bán A tạo được sản phẩm đứng tên nhà
# bán B chỉ bằng cách sửa một dòng JSON.

seller_products:
  get:
    tags: [Seller]
    summary: Danh sách sản phẩm của tôi
    description: |
      Khác endpoint công khai: ở đây nhà bán XEM ĐƯỢC hàng nháp và hàng
      đang chờ duyệt của chính mình. Câu truy vấn luôn kẹp `seller_id` nên
      không lộ hàng của gian khác.
    operationId: listMyProducts
    security:
      - bearerAuth: []
    parameters:
      - name: status
        in: query
        schema:
          type: string
          enum: [DRAFT, PENDING_REVIEW, ACTIVE, INACTIVE, ARCHIVED]
    responses:
      '200':
        description: Danh sách sản phẩm
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/SellerProduct'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'

  post:
    tags: [Seller]
    summary: Tạo sản phẩm mới
    description: |
      Sản phẩm sinh ra ở trạng thái `DRAFT` — chưa ai thấy. Nó chỉ ra cửa
      hàng sau khi nhà bán gửi duyệt và nhân viên vận hành duyệt.

      **Hàng rào chống hàng giả:** gian hàng phải được ủy quyền bán thương
      hiệu đó (`CanSellerSellBrand`). Không được phép thì trả 403 kèm lý do
      để giao diện chỉ ra hành động cụ thể.
    operationId: createMyProduct
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/common.yaml#/parameters/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [brand_id, name, slug, product_type]
            properties:
              brand_id:
                $ref: '../components/common.yaml#/schemas/Id'
              collection_id:
                $ref: '../components/common.yaml#/schemas/Id'
              category_id:
                $ref: '../components/common.yaml#/schemas/Id'
              size_chart_id:
                $ref: '../components/common.yaml#/schemas/Id'
              name:
                type: string
              slug:
                type: string
              description:
                type: string
              material_composition:
                type: string
                description: Bắt buộc TRƯỚC KHI gửi duyệt, không bắt buộc lúc tạo nháp.
              care_instructions:
                type: string
              origin_country:
                type: string
              product_type:
                type: string
                enum: [TOP, BOTTOM, DRESS, OUTERWEAR, SHOES, BAG, ACCESSORY]
              gender_target:
                type: string
                enum: [MEN, WOMEN, UNISEX, KIDS]
              images:
                type: array
                items:
                  type: string
    responses:
      '201':
        description: Đã tạo, trạng thái DRAFT
        content:
          application/json:
            schema:
              $ref: '#/SellerProduct'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '403':
        description: Gian hàng chưa được phép bán thương hiệu này
        content:
          application/json:
            schema:
              $ref: '../components/common.yaml#/schemas/Error'

seller_product_detail:
  patch:
    tags: [Seller]
    summary: Sửa sản phẩm
    description: |
      Sửa thông tin một sản phẩm ở `DRAFT` (gồm cả nháp "bị trả về", vì từ
      chối đưa sản phẩm về lại DRAFT) hoặc `ACTIVE`.

      **Ngữ nghĩa PATCH:** trường nào VẮNG thì giữ nguyên. Trường có mặt thì
      đổi — kể cả `""`, và `""` với `name`/`slug`/`category_id` là lỗi chứ
      không phải "bỏ qua".

      **`images` THAY THẾ cả danh sách**, không nối thêm: gỡ được ảnh sai,
      đổi được thứ tự (ảnh đầu là ảnh bìa).

      # Hai trạng thái sửa được, và chúng KẾT THÚC khác nhau

      ```text
      DRAFT   chỉ nhà bán thấy → sửa xong vẫn DRAFT
      ACTIVE  khách đang thấy  → sửa xong về PENDING_REVIEW, TẠM ẨN khỏi
                                 cửa hàng cho tới khi duyệt lại
      ```

      Vế thứ hai là quyết định 23/09/2026. Cho sửa hàng đang bán mà KHÔNG
      duyệt lại là mở cửa sau: đăng một trang sạch, chờ duyệt xong, rồi
      tráo ảnh và tên. Cấm hẳn thì một lỗi chính tả cũng buộc nhà bán đăng
      lại sản phẩm mới — và họ sẽ làm thế, để lại danh mục đầy bản trùng.

      Response trả `status` MỚI, nên bên gọi thấy ngay hậu quả.

      Sửa hàng đang bán mà làm nó THIẾU điều kiện duyệt (ví dụ gỡ hết ảnh)
      thì cả lượt sửa bị từ chối 400 — không để sản phẩm rơi vào hàng chờ
      duyệt ở trạng thái không bao giờ duyệt được.

      `PENDING_REVIEW` và `INACTIVE` thì KHÔNG sửa được (409). Người kiểm
      duyệt đang xem cái thứ nhất; cái thứ hai bật lại được mà không cần
      duyệt vì nội dung không đổi — cho sửa sẽ phá đúng giả định ấy.

      # Không đổi được thương hiệu

      Thương hiệu được kiểm quyền bán ĐÚNG MỘT LẦN, lúc tạo. Cho đổi ở đây
      là mở đường vòng qua hàng rào chống hàng giả: tạo dưới thương hiệu
      OPEN, rồi đổi sang thương hiệu được bảo hộ. Gửi `brand_id` trả 400
      kèm lý do.

      # Vì sao endpoint này tồn tại

      Thêm 19/09/2026. Trước đó KHÔNG có đường nào sửa sản phẩm sau khi tạo:
      tạo thiếu ảnh là tạo một bản ghi không bao giờ gửi duyệt được, và bị
      trả về kèm lý do thì không sửa theo lý do ấy được. Xem P3-64.
    operationId: updateMyProduct
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/common.yaml#/parameters/IdempotencyKey'
      - $ref: '../components/common.yaml#/parameters/ProductId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
              slug:
                type: string
              description:
                type: string
              care_instructions:
                type: string
              material_composition:
                type: string
              origin_country:
                type: string
              category_id:
                $ref: '../components/common.yaml#/schemas/Id'
              size_chart_id:
                $ref: '../components/common.yaml#/schemas/Id'
              product_type:
                type: string
                enum: [TOP, BOTTOM, DRESS, OUTERWEAR, SHOES, BAG, ACCESSORY]
              gender_target:
                type: string
                enum: [WOMEN, MEN, UNISEX, KIDS]
              images:
                type: array
                description: THAY THẾ toàn bộ danh sách ảnh.
                items:
                  type: string
    responses:
      '200':
        description: Sản phẩm sau khi sửa
        content:
          application/json:
            schema:
              $ref: '#/SellerProduct'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '409':
        description: |
          Sản phẩm ở `PENDING_REVIEW` hoặc `INACTIVE`, hoặc slug đã có sản
          phẩm khác dùng.
        content:
          application/json:
            schema:
              $ref: '../components/common.yaml#/schemas/Error'

seller_product_variants:
  post:
    tags: [Seller]
    summary: Thêm biến thể và SKU
    description: |
      Biến thể là tổ hợp thuộc tính (màu + size). Mã SKU phải DUY NHẤT
      toàn hệ thống — đây là định danh hàng hóa chung, không thuộc gian
      hàng nào.
    operationId: addMyProductVariant
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/common.yaml#/parameters/IdempotencyKey'
      - $ref: '../components/common.yaml#/parameters/ProductId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [attributes, skus]
            properties:
              attributes:
                type: object
                additionalProperties:
                  type: string
                examples:
                  - {color: 'Đen', size: 'M'}
              images:
                type: array
                items:
                  type: string
              skus:
                type: array
                items:
                  type: object
                  required: [sku_code]
                  properties:
                    sku_code:
                      type: string
                    barcode:
                      type: string
                    weight_gram:
                      type: integer
                    length_mm:
                      type: integer
                    width_mm:
                      type: integer
                    height_mm:
                      type: integer
    responses:
      '200':
        description: Đã thêm biến thể
        content:
          application/json:
            schema:
              $ref: '#/SellerProduct'
      '404':
        description: Không tìm thấy sản phẩm, HOẶC sản phẩm của gian hàng khác
        content:
          application/json:
            schema:
              $ref: '../components/common.yaml#/schemas/Error'
      '409':
        description: Mã SKU đã tồn tại

seller_product_submit:
  post:
    tags: [Seller]
    summary: Gửi sản phẩm đi duyệt
    description: |
      Chuyển `DRAFT` → `PENDING_REVIEW`.

      Kiểm điều kiện đầy đủ trước khi chuyển, và lỗi trả về NÓI RÕ thiếu
      gì: mô tả, ảnh, biến thể, bảng size (với hàng thời trang), thành
      phần chất liệu. Thông báo chung chung ở đây làm nhà bán bỏ dở việc
      đăng bán vì không biết sửa chỗ nào.
    operationId: submitMyProduct
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/common.yaml#/parameters/IdempotencyKey'
      - $ref: '../components/common.yaml#/parameters/ProductId'
    responses:
      '200':
        description: Đã chuyển sang PENDING_REVIEW
        content:
          application/json:
            schema:
              $ref: '#/SellerProduct'
      '400':
        description: Chưa đủ điều kiện gửi duyệt — thông báo nêu rõ thiếu gì
      '404':
        description: Không tìm thấy sản phẩm, HOẶC sản phẩm của gian hàng khác
      '409':
        description: Sản phẩm không ở trạng thái cho phép gửi duyệt

SellerProduct:
  type: object
  description: |
    Sản phẩm nhìn từ phía gian hàng.

    Khác `ProductDetail` của cửa hàng: có `status` và `rejection_reason` —
    hai thứ khách KHÔNG được thấy, và là hai thứ nhà bán cần nhất.
  required: [id, name, status]
  properties:
    id:
      $ref: '../components/common.yaml#/schemas/Id'
    name:
      type: string
    slug:
      type: string
    status:
      type: string
      enum: [DRAFT, PENDING_REVIEW, ACTIVE, INACTIVE, ARCHIVED]
    rejection_reason:
      type: string
      description: Vì sao bị từ chối. Rỗng khi chưa từng bị từ chối.
    brand_id:
      $ref: '../components/common.yaml#/schemas/Id'
    product_type:
      type: string
    description:
      type: string
    care_instructions:
      type: string
    material_composition:
      type: string
    origin_country:
      type: string
    category_id:
      $ref: '../components/common.yaml#/schemas/Id'
    gender_target:
      type: string
    images:
      type: array
      description: |
        Ảnh HIỆN TẠI, theo thứ tự (ảnh đầu là ảnh bìa). `[]` khi chưa có.

        Các trường từ `description` tới đây trả ra để biểu mẫu SỬA điền sẵn
        giá trị hiện tại (19/09/2026). Không có chúng thì mọi lần sửa bắt
        đầu từ ô trống — và một PATCH gửi ô trống sẽ xóa mất dữ liệu cũ.
      items:
        type: string
    variants:
      type: array
      description: |
        Biến thể ĐÃ có. Mảng rỗng nghĩa là sản phẩm chưa gửi duyệt được —
        `submitMyProduct` đòi ít nhất một biến thể.

        KHÔNG dùng `omitempty` ở phía máy chủ: `[]` và thiếu trường nói hai
        chuyện khác nhau.

        Thêm 18/09/2026. Dữ liệu vốn đã được nạp sẵn cho mọi truy vấn danh
        sách rồi bị vứt ở tầng DTO — cùng hình dạng với `shipping_groups`
        (P3-50). Hệ quả: nhà bán thêm biến thể xong không có cách nào thấy
        mình đã thêm gì.

        KHÔNG kèm giá và tồn kho: cả hai thuộc module khác, và nhét chúng
        vào đây biến một lượt đọc sản phẩm thành ba lượt gọi liên module.
      items:
        type: object
        required: [id, attributes, skus]
        properties:
          id:
            $ref: '../components/common.yaml#/schemas/Id'
          attributes:
            type: object
            description: Tổ hợp làm nên biến thể — `color`, `size`…
            additionalProperties:
              type: string
          images:
            type: array
            items:
              type: string
          skus:
            type: array
            items:
              type: object
              required: [id, sku_code]
              properties:
                id:
                  $ref: '../components/common.yaml#/schemas/Id'
                sku_code:
                  type: string
    created_at:
      type: string
      format: date-time

returns:
  get:
    tags: [Seller]
    summary: Yêu cầu trả hàng của gian hàng tôi
    description: |
      Hộp việc của nhà bán cho luồng trả hàng.

      Chỉ trả yêu cầu thuộc gian hàng của người gọi — `seller_id` lấy từ
      token, KHÔNG nhận từ tham số. Cho client chỉ định nghĩa là ai cũng
      đọc được yêu cầu trả hàng của gian hàng khác.
    operationId: listMyReturns
    security:
      - bearerAuth: []
    parameters:
      - name: status
        in: query
        description: Lọc theo trạng thái. Bỏ trống thì trả tất cả.
        schema:
          type: string
          enum: [REQUESTED, APPROVED, REJECTED, RECEIVED, REFUNDED, CANCELLED]
    responses:
      '200':
        description: Danh sách yêu cầu trả hàng
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas.yaml#/ReturnRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'

return_approve:
  post:
    tags: [Seller]
    summary: Duyệt yêu cầu trả hàng
    description: |
      Đồng ý cho khách gửi hàng về. CHƯA hoàn tiền — tiền chỉ đi sau khi
      hàng về tới nơi (`receiveReturn`).

      Tách hai bước có chủ ý: hoàn tiền ngay lúc duyệt nghĩa là nền tảng
      trả tiền cho một món hàng có thể không bao giờ được gửi đi.
    operationId: approveReturn
    security:
      - bearerAuth: []
    parameters:
      - name: return_id
        in: path
        required: true
        schema:
          $ref: '../components/common.yaml#/schemas/Id'
      - $ref: '../components/common.yaml#/parameters/IdempotencyKey'
    responses:
      '200':
        $ref: '#/ReturnResponse'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '409':
        description: Trạng thái hiện tại không cho phép duyệt

return_reject:
  post:
    tags: [Seller]
    summary: Từ chối yêu cầu trả hàng
    description: |
      Lý do là BẮT BUỘC và đi thẳng tới khách. Từ chối không kèm lý do là
      cách chắc chắn nhất để một yêu cầu trả hàng thành một khiếu nại.
    operationId: rejectReturn
    security:
      - bearerAuth: []
    parameters:
      - name: return_id
        in: path
        required: true
        schema:
          $ref: '../components/common.yaml#/schemas/Id'
      - $ref: '../components/common.yaml#/parameters/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            properties:
              reason:
                type: string
                minLength: 1
    responses:
      '200':
        $ref: '#/ReturnResponse'
      '400':
        $ref: '../components/common.yaml#/responses/BadRequest'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'

return_receive:
  post:
    tags: [Seller]
    summary: Xác nhận đã nhận hàng hoàn và hoàn tiền
    description: |
      Hàng đã về tới kho. Đây là bước ĐI TIỀN: bút toán hoàn tiền được ghi
      ở đây, không phải lúc duyệt.

      Hàng về nằm ở trạng thái `Returned`, chưa bán lại được — quyết định
      đó thuộc bước kiểm định (`inspectReturn`).
    operationId: receiveReturn
    security:
      - bearerAuth: []
    parameters:
      - name: return_id
        in: path
        required: true
        schema:
          $ref: '../components/common.yaml#/schemas/Id'
      - $ref: '../components/common.yaml#/parameters/IdempotencyKey'
    responses:
      '200':
        $ref: '#/ReturnResponse'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
      '404':
        $ref: '../components/common.yaml#/responses/NotFound'
      '409':
        description: Yêu cầu chưa được duyệt

# Ba bước trên trả cùng một hình dạng, nên khai một lần.
ReturnResponse:
  description: Yêu cầu trả hàng sau khi cập nhật
  content:
    application/json:
      schema:
        type: object
        required: [return]
        properties:
          return:
            $ref: '../components/schemas.yaml#/ReturnRequest'

brands_i_may_sell:
  get:
    tags: [Seller]
    summary: Thương hiệu tôi được phép bán
    description: |
      Danh sách thương hiệu gian hàng ĐƯỢC PHÉP đăng sản phẩm dưới tên đó.

      # Vì sao endpoint này phải tồn tại

      `createMyProduct` đòi `brand_id` và TỪ CHỐI mọi thương hiệu gian hàng
      không được phép bán — hàng rào chống hàng giả, đúng như nó cần phải
      thế. Nhưng cho tới 17/09/2026 không có đường nào để BIẾT mình được
      phép bán thương hiệu nào: `getBrand` chỉ tra từng cái một, theo id.

      Hệ quả: luồng đăng sản phẩm không hoàn thành được qua giao diện —
      không phải vì thiếu endpoint GHI, mà vì thiếu endpoint ĐỌC để điền
      vào biểu mẫu.

      Danh sách lọc bằng CHÍNH quy tắc của đường ghi (`CanSellerSellBrand`),
      không phải một bản sao: hai bản sao của một quy tắc chống hàng giả sẽ
      lệch, và khi ấy biểu mẫu mời chọn một thương hiệu rồi đường ghi từ
      chối nó.
    operationId: listBrandsIMaySell
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Thương hiệu được phép bán
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: array
                  items:
                    type: object
                    required: [id, name, protection_level]
                    properties:
                      id:
                        $ref: '../components/common.yaml#/schemas/Id'
                      name:
                        type: string
                      slug:
                        type: string
                      logo_url:
                        type: string
                      protection_level:
                        type: string
                        description: |
                          Vì sao bạn được bán thương hiệu này. `OPEN` là ai
                          cũng bán được; `RESTRICTED` nghĩa là gian hàng
                          của bạn được chỉ định.
                        enum: [OPEN, RESTRICTED, VERIFIED_ONLY]
      '403':
        $ref: '../components/common.yaml#/responses/Forbidden'

settlements:
  get:
    tags: [Seller]
    summary: Danh sách đợt đối soát của tôi
    description: |
      Các đợt đối soát đã tạo cho gian hàng này, mới nhất trước.

      Chi tiết từng dòng nằm ở `getMySettlement` — danh sách chỉ trả phần
      đầu để nhà bán biết có đợt nào và tổng bao nhiêu.
    operationId: listMySettlements
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Danh sách đợt đối soát
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: array
                  # `items: {type: object}` của bản trước là đặc tả KHÔNG
                  # đặc tả gì: `openapi-typescript` sinh ra
                  # `Record<string, unknown>[]`, nên giao diện phải ép kiểu
                  # bằng tay — và ép kiểu bằng tay là chỗ hợp đồng thôi
                  # được trình biên dịch canh. Sửa 17/09/2026.
                  items:
                    $ref: '../components/schemas.yaml#/Settlement'
      '401':
        $ref: '../components/common.yaml#/responses/Unauthorized'
