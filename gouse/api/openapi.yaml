openapi: 3.1.0

info:
  title: Fashion Commerce Platform API
  version: 1.0.0
  description: |
    API của nền tảng thương mại thời trang.

    **Đây là nguồn sự thật duy nhất về hợp đồng API.** Đặc tả phải được cập nhật
    trong cùng pull request với thay đổi code; CI so sánh đặc tả với cài đặt và
    thất bại nếu lệch.

    ## Sáu nhóm API

    | Nhóm | Đường dẫn | Phạm vi dữ liệu |
    |---|---|---|
    | Storefront | `/api/v1/...` | Dữ liệu của chính khách hàng |
    | Seller Center | `/api/v1/seller/...` | **Chỉ** dữ liệu gian hàng của mình |
    | Creator Center | `/api/v1/creator/...` | Nội dung và thu nhập của mình; **không** có dữ liệu cá nhân khách |
    | Admin | `/api/v1/admin/...` | Theo vai trò; truy cập dữ liệu cá nhân đều ghi audit |
    | Partner | `/api/v1/partner/...` | Theo hợp đồng (Phase 4) |
    | Webhook | `/api/v1/webhooks/...` | Xác minh chữ ký |

    ## Quy ước bắt buộc

    - **Tiền**: luôn trả về `{ amount, currency }`. `amount` là **số nguyên** theo
      đơn vị nhỏ nhất của tiền tệ (VND: đồng; USD: cent). Không bao giờ dùng số thực.
    - **Idempotency**: mọi `POST`/`PATCH` thay đổi trạng thái yêu cầu header
      `Idempotency-Key`.
    - **Phần trăm**: biểu diễn bằng basis points (1000 = 10,00%).
    - **Thời gian**: ISO 8601, luôn UTC.
    - **Định danh**: chuỗi có tiền tố (`ord_`, `sku_`, `off_`...).
    - **Enum**: client **phải** xử lý được giá trị chưa biết mà không crash.

    ## Tài liệu liên quan

    - Chuẩn API: `docs/06-api/api-guidelines.md`
    - Phân nhóm và phân quyền: `docs/06-api/api-domains.md`
    - Idempotency: `docs/05-data/idempotency.md`

