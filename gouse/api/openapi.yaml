components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token thời hạn ngắn (15 phút). Làm mới bằng refresh token
        lưu trong httpOnly cookie.

        Token chứa `user_id`, vai trò, và `seller_id`/`creator_id` nếu có.
        **Phạm vi dữ liệu được áp dụng trong truy vấn ở tầng repository**,
        không phải ở tầng hiển thị.

    webhookSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: |
        Chữ ký HMAC-SHA256 của payload, ký bằng khóa bí mật của nhà cung cấp.
        **Bắt buộc xác minh** — không có bước này, bất kỳ ai cũng có thể gửi
        thông báo "thanh toán thành công" giả.
