# Bài kiểm cho quy tắc cảnh báo.
#
# # Vì sao `promtool check rules` là KHÔNG ĐỦ
#
# `check rules` chỉ nói biểu thức đúng cú pháp. Một biểu thức đúng cú pháp
# nhưng lọc nhầm nhãn, so sai chiều, hoặc dựa vào một nhãn không ai đặt vẫn
# "hợp lệ" — nó chạy, không bao giờ khớp dòng nào, và không bao giờ kêu.
#
# Đó là kiểu hỏng tệ nhất của hệ giám sát: nó không báo lỗi, nó chỉ im lặng,
# và người ta phát hiện vào đúng lúc cần nó nhất.
#
# Các bài dưới nạp chuỗi số liệu thật rồi khẳng định cảnh báo có kêu, kêu
# đúng lúc, và mang đúng nhãn để định tuyến tới người trực.
#
# Bài thứ tư là bài NGƯỢC: job chạy LÂU thì KHÔNG được báo là đứng. Không
# có nó thì một quy tắc "kêu với mọi thứ" vẫn qua được mọi bài còn lại.
#
# Chạy: promtool test rules deploy/prometheus/alerts_test.yml

rule_files:
- alerts.yml
evaluation_interval: 1m
tests:
- interval: 1m
  input_series:
  - series: up{job="gouse-worker", instance="localhost:9091"}
    values: 1 1 0 0 0 0
  alert_rule_test:
  - eval_time: 2m
    alertname: WorkerDown
    exp_alerts: []
  - eval_time: 5m
    alertname: WorkerDown
    exp_alerts:
    - exp_labels:
        severity: critical
        job: gouse-worker
        instance: localhost:9091
      exp_annotations:
        summary: Tiến trình worker không trả lời
        description: 'Prometheus không thu thập được /metrics của worker trong 1 phút. Không có worker
          thì event không được phát: đơn thực hiện không được tạo, tồn kho không chuyển Reserved → Committed,
          và tiến trình dọn có thể nhả hàng của một đơn ĐÃ THANH TOÁN.'
        runbook: docs/09-operations/observability.md
- interval: 1m
  input_series:
  - series: gouse_worker_heartbeat_timestamp_seconds{job="gouse-worker"}
    values: 0+0x10
  alert_rule_test:
  - eval_time: 3m
    alertname: WorkerLoopStalled
    exp_alerts:
    - exp_labels:
        severity: critical
        job: gouse-worker
      exp_annotations:
        summary: Vòng lặp điều phối của worker đã dừng
        description: Nhịp tim cũ hơn 60 giây trong khi nó phải đập mỗi 5 giây. Tiến trình còn trả lời
          nhưng bộ điều phối không chạy — kiểm tra deadlock hoặc goroutine bị chặn.
# Job nhịp 30 giây mà 10 phút không thành công: TREO thật.
- interval: 1m
  input_series:
  - series: gouse_worker_job_last_success_timestamp_seconds{job="gouse-worker", job_name="dọn giữ hàng
      quá hạn"}
    values: 0+0x20
  - series: gouse_worker_job_running{job="gouse-worker", job_name="dọn giữ hàng quá hạn"}
    values: 0+0x20
  - series: gouse_worker_job_interval_seconds{job="gouse-worker", job_name="dọn giữ hàng quá hạn"}
    values: 30+0x20
  alert_rule_test:
  - eval_time: 10m
    alertname: WorkerJobStalled
    exp_alerts:
    - exp_labels:
        severity: critical
        job: gouse-worker
        job_name: dọn giữ hàng quá hạn
      exp_annotations:
        summary: Job dọn giữ hàng quá hạn lâu không chạy xong thành công
        description: Job đã lỡ ba nhịp liên tiếp VÀ hiện không chạy. Đây là treo thật, không phải một
          lượt chạy dài.

# Bài NGƯỢC 1: job đang CHẠY thì không phải treo, dù lâu chưa thành công.
- interval: 1m
  input_series:
  - series: gouse_worker_job_last_success_timestamp_seconds{job="gouse-worker", job_name="job chạy lâu"}
    values: 0+0x20
  - series: gouse_worker_job_running{job="gouse-worker", job_name="job chạy lâu"}
    values: 1+0x20
  - series: gouse_worker_job_interval_seconds{job="gouse-worker", job_name="job chạy lâu"}
    values: 30+0x20
  alert_rule_test:
  - eval_time: 10m
    alertname: WorkerJobStalled
    exp_alerts: []

# Bài NGƯỢC 2 — bài quan trọng nhất của nhóm này.
#
# Job nhịp 10 PHÚT, thành công lúc phút 0, chưa tới lượt kế tiếp: KHỎE.
#
# Bản luật trước dùng ngưỡng cố định 300 giây nên nó kêu ở phút thứ 9 —
# mức critical, cho một job hoàn toàn bình thường. Ba job thật của worker
# chạy thưa hơn 300 giây (10 phút, 1 giờ, 1 giờ), nên bảng cảnh báo có
# một dòng critical đỏ vĩnh viễn, và người trực học cách bỏ qua cả bảng.
- interval: 1m
  input_series:
  - series: gouse_worker_job_last_success_timestamp_seconds{job="gouse-worker", job_name="hoàn tất đơn
      đã giao quá hạn đổi trả"}
    values: 0+0x20
  - series: gouse_worker_job_running{job="gouse-worker", job_name="hoàn tất đơn đã giao quá hạn đổi trả"}
    values: 0+0x20
  - series: gouse_worker_job_interval_seconds{job="gouse-worker", job_name="hoàn tất đơn đã giao quá hạn
      đổi trả"}
    values: 600+0x20
  alert_rule_test:
  # Phút 9: chưa tới lượt chạy kế tiếp. Đây là lúc luật cũ kêu oan.
  - eval_time: 9m
    alertname: WorkerJobStalled
    exp_alerts: []
  # Phút 20: đã lỡ hai nhịp — vẫn chưa đủ, ngưỡng là ba nhịp.
  - eval_time: 20m
    alertname: WorkerJobStalled
    exp_alerts: []
- interval: 1m
  input_series:
  - series: gouse_outbox_dead_lettered_events{job="gouse-worker"}
    values: 0 0 3 3 3
  alert_rule_test:
  - eval_time: 4m
    alertname: OutboxDeadLettered
    exp_alerts:
    - exp_labels:
        severity: critical
        job: gouse-worker
      exp_annotations:
        summary: Có event không phát được sau khi thử hết số lần
        description: Xem cột last_error trong bảng event_outbox. Có sự thật nghiệp vụ không tới được bên
          nhận.
- interval: 1m
  input_series:
  - series: gouse_business_failures_total{job="gouse-api", stage="checkout", reason="het_hang"}
    values: 0+10x20
  alert_rule_test:
  - eval_time: 16m
    alertname: CheckoutFailuresSpiking
    exp_alerts:
    - exp_labels:
        severity: warning
        job: gouse-api
        stage: checkout
        reason: het_hang
      exp_annotations:
        summary: Thất bại ở bước thanh toán đang tăng
        description: 'Xem nhãn `reason` để biết loại: hết hàng là chuyện thường lúc cao điểm, `internal`
          thì không.'
- interval: 1m
  input_series:
  - series: gouse_http_request_duration_seconds_count{job="gouse-api", status="200", path="/api/v1/products"}
    values: 0+100x20
  - series: gouse_http_request_duration_seconds_count{job="gouse-api", status="500", path="/api/v1/products"}
    values: 0+5x20
  alert_rule_test:
  - eval_time: 16m
    alertname: APIHighErrorRate
    exp_alerts:
    - exp_labels:
        severity: critical
      exp_annotations:
        summary: Hơn 1% request trả lỗi máy chủ

# --------------------------------------------------------------------
# Đối soát tiền
# --------------------------------------------------------------------

# Chênh lệch thoáng qua giữa hai lượt job: KHÔNG kêu.
# Chênh lệch kéo dài: kêu, mức critical.
- interval: 1m
  input_series:
  - series: gouse_payment_reconcile_mismatch{job="gouse-worker"}
    values: 0 0 2 0 0 0 0 0 0 0
  alert_rule_test:
  - eval_time: 6m
    alertname: PaymentReconcileMismatch
    exp_alerts: []
- interval: 1m
  input_series:
  - series: gouse_payment_reconcile_mismatch{job="gouse-worker"}
    values: 0 0 2+0x12
  alert_rule_test:
  # Phút 5: mới lệch 3 phút, chưa đủ `for: 5m`.
  - eval_time: 5m
    alertname: PaymentReconcileMismatch
    exp_alerts: []
  - eval_time: 10m
    alertname: PaymentReconcileMismatch
    exp_alerts:
    - exp_labels:
        severity: critical
        job: gouse-worker
      exp_annotations:
        summary: Có 2 đơn ĐÃ THU TIỀN mà trạng thái chưa cập nhật
        description: Tiền đã vào tài khoản nhưng khách vẫn thấy đơn chờ thanh toán. Không có ca hợp lệ
          nào cho tình trạng này. Xem log worker mức ERROR để lấy intent_id và order_id, rồi kiểm tra
          vì sao MarkOrderPaid không chạy.
        runbook: docs/09-operations/observability.md

# Bài NGƯỢC — bài quan trọng nhất của nhóm này.
#
# Số gói bặt tin ĐỨNG YÊN ở mức cao (20, đúng con số đo được trên dữ liệu
# thật) thì KHÔNG kêu: đó là vài chục gói lẻ mắc kẹt, không phải nguồn
# webhook đã chết. Không có bài này thì một luật `> 0` vẫn qua mọi bài còn
# lại — trong khi nó kêu suốt ngày đầu tiên và không ai đọc nữa.
- interval: 10m
  input_series:
  - series: gouse_fulfillment_delivery_silent{job="gouse-worker"}
    values: 20+0x60
  alert_rule_test:
  - eval_time: 8h
    alertname: DeliverySilenceGrowing
    exp_alerts: []

# Số gói TĂNG ĐỀU: nguồn webhook đã ngừng tới — kêu.
- interval: 10m
  input_series:
  - series: gouse_fulfillment_delivery_silent{job="gouse-worker"}
    values: 0+1x60
  alert_rule_test:
  - eval_time: 8h
    alertname: DeliverySilenceGrowing
    exp_alerts:
    - exp_labels:
        severity: warning
        job: gouse-worker
      exp_annotations:
        summary: Số gói bặt tin vận chuyển đang tăng đều
        description: Tăng liên tục trong 6 giờ nghĩa là cập nhật từ hãng vận chuyển đã ngừng tới, không
          phải vài gói lẻ mắc kẹt. Mỗi gói là một khoản phải trả nhà bán chưa chuyển sang khả dụng, vì
          số dư chỉ giải phóng khi đơn đi hết DELIVERED → COMPLETED.
        runbook: docs/09-operations/observability.md
